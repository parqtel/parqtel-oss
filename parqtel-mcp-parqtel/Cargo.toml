[package]
name = "parqtel-mcp-parqtel"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "MCP server for parqtel self-access"

[[bin]]
name = "parqtel-mcp-parqtel"
path = "src/main.rs"

[dependencies]
parqtel-mcp-core = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
schemars = { workspace = true }
# rustls-tls keeps the standalone MCP images OpenSSL-free (matches the
# workspace-wide linkage story; see compose/mcp/Dockerfile.parqtel).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-rustls = { version = "0.26", features = ["ring"] }
rustls = { version = "0.23", features = ["ring"] }
