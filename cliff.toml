# git-cliff configuration — the single source of the generated changelog block.
#
# CHANGELOG.md keeps hand-written release highlights. Between the
# <!-- changelog:auto-start --> / <!-- changelog:auto-end --> markers the
# `changelog` GitHub workflow (and `make changelog`) writes
# this generated list of every user-visible commit since the last tag, so no
# change can go unrecorded. `make cut-release` folds the section into a dated
# release heading, and `.github/workflows/release.yml` publishes it as the
# GitHub release notes.
#
# The [bump] table drives the semantic version: a feature commit bumps the
# minor version, any other change bumps the patch version, and a breaking
# change bumps the major version. While the project is 0.x, breaking changes
# bump the minor version instead (bump-minor-pre-major semantics).

[changelog]
header = ""
body = """
{% if commits | length == 0 -%}
_No unreleased changes._
{% else -%}
{% for group, commits in commits | group_by(attribute="group") %}
#### {{ group }}
{% for commit in commits %}
- {{ commit.message | split(pat="\\n") | first | trim }}{% if commit.breaking %} **BREAKING**{% endif %}

{% endfor %}
{% endfor %}
{% endif -%}
"""
trim = true
render_always = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = false
filter_commits = true
sort_commits = "oldest"
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^revert", group = "Reverts" },
  { message = "^security", group = "Security" },
  { message = "^build", group = "Build" },
  { message = "^docs", skip = true },
  { message = "^chore", skip = true },
  { message = "^ci", skip = true },
  { message = "^test", skip = true },
  { message = "^style", skip = true },
  { message = ".*", skip = true },
]

[bump]
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "0.1.0"
