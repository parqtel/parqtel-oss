name: Chart Visibility

# GHCR packages created by a workflow start private, which breaks the
# documented `helm install oci://ghcr.io/parqtel/charts/parqtel` for anonymous
# users. GitHub limits the package endpoints to a personal access token
# (classic): OAuth app tokens (what `gh auth login` mints) and the Actions
# GITHUB_TOKEN answer 404 on the visibility PATCH even with write:packages.
# Dispatch with a classic PAT in the `token` input, or use the GHCR UI.

on:
  workflow_dispatch:
    inputs:
      token:
        description: "Personal access token (classic) with write:packages; the default github.token cannot change package visibility"
        required: false
      package:
        description: "Package name under the org (default charts/parqtel)"
        required: false
        default: "charts/parqtel"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Make the chart package public
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set visibility
        env:
          OWNER: ${{ github.repository_owner }}
          PACKAGE: ${{ inputs.package }}
          # An input wins over the workflow token so an org admin can dispatch
          # with a PAT; the default attempt documents whether that token is
          # enough (it is not for packages it does not administer).
          GH_TOKEN: ${{ inputs.token || github.token }}
        run: |
          set -o pipefail
          enc="${PACKAGE//\//%2F}"
          code="$(gh api -i -X PATCH "/orgs/${OWNER}/packages/container/${enc}" \
            -f visibility=public 2>/dev/null | sed -n '1s/^HTTP\/[0-9.]* //p' | tr -d '\r' || true)"
          echo "PATCH ${enc}: HTTP ${code:-none}"
          if [[ "$code" != "200" ]]; then
            echo "::error::cannot change package visibility (HTTP ${code:-none}). GitHub accepts only a personal access token (classic) with write:packages here; GITHUB_TOKEN and gh OAuth tokens always answer 404. Dispatch again with the token input, or toggle it in the UI: https://github.com/orgs/${OWNER}/packages/container/${enc}/settings"
            exit 1
          fi
      - name: Verify anonymous read
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          set -o pipefail
          # Anonymous pull token, i.e. the exact request `helm install` makes.
          token="$(curl -fsS "https://ghcr.io/token?scope=repository:parqtel/${PACKAGE}:pull" \
            | jq -r .token)"
          code="$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            "https://ghcr.io/v2/parqtel/${PACKAGE}/tags/list")"
          echo "anonymous tags/list: HTTP ${code}"
          [[ "$code" == "200" ]] || { echo "::error::package is still not anonymously readable"; exit 1; }
