name: Chart Visibility

# GHCR packages created by a workflow start private, which breaks the
# documented `helm install oci://ghcr.io/parqtel/charts/parqtel` for anonymous
# users. Changing visibility needs `write:packages`; the release workflow's
# GITHUB_TOKEN has it, so this dispatch flips the chart package to public and
# reports the result. Idempotent: run it again whenever a new chart package
# appears.

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Make the chart package public
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set visibility
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -o pipefail
          # The package name is not always `<repo>-derived`: resolve it from the
          # org listing, then fall back to the expected Helm OCI path.
          names="$(gh api "/orgs/${OWNER}/packages?package_type=container&per_page=100" \
            --jq '.[].name' 2>/dev/null || true)"
          echo "org packages:"; printf '%s\n' "$names"
          candidates="$(printf '%s\n' "$names" | grep -iE 'charts?(/|-)' || echo 'charts/parqtel')"
          rc=1
          for name in $candidates; do
            enc="${name//\//%2F}"
            echo "--- PATCH ${enc}"
            if gh api -X PATCH "/orgs/${OWNER}/packages/container/${enc}" \
                 -f visibility=public --jq '"visibility: " + .visibility'; then
              echo "public: ${name}"
              rc=0
            fi
          done
          exit "$rc"
      - name: Verify anonymous read
        run: |
          set -o pipefail
          token="$(curl -fsS "https://ghcr.io/token?scope=repository:parqtel/charts/parqtel:pull" \
            | jq -r .token)"
          code="$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            "https://ghcr.io/v2/parqtel/charts/parqtel/tags/list")"
          echo "anonymous tags/list: HTTP ${code}"
          [[ "$code" == "200" ]] || { echo "::error::chart package is still not anonymously readable"; exit 1; }
