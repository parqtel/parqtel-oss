name: Chart Visibility

# GHCR packages created by a workflow start private, which breaks the
# documented `helm install oci://ghcr.io/parqtel/charts/parqtel` for anonymous
# users. Changing visibility needs `write:packages`; the release workflow's
# GITHUB_TOKEN has it, so this dispatch flips the chart package to public and
# reports the result. Idempotent: run it again whenever a new chart package
# appears.

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Make the chart package public
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set visibility
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -o pipefail
          # The package name is not the OCI path verbatim; ask the API which
          # candidate exists, then flip the first one that answers.
          candidates="charts%2Fparqtel parqtel%2Fcharts%2Fparqtel parqtel-charts charts-parqtel parqtel"
          rc=1
          for enc in $candidates; do
            code="$(gh api -i -X PATCH "/orgs/${OWNER}/packages/container/${enc}" \
              -f visibility=public 2>/dev/null | sed -n '1s/^HTTP\/[0-9.]* //p' | tr -d '\r' || true)"
            echo "${enc}: HTTP ${code:-none}"
            if [[ "$code" == "200" ]]; then rc=0; fi
          done
          exit "$rc"
      - name: Verify anonymous read
        run: |
          set -o pipefail
          token="$(curl -fsS "https://ghcr.io/token?scope=repository:parqtel/charts/parqtel:pull" \
            | jq -r .token)"
          code="$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            "https://ghcr.io/v2/parqtel/charts/parqtel/tags/list")"
          echo "anonymous tags/list: HTTP ${code}"
          [[ "$code" == "200" ]] || { echo "::error::chart package is still not anonymously readable"; exit 1; }
