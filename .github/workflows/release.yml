name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Quality Gate ──────────────────────────────────────────────────────────
  # A tag can be pushed to any commit (including stale ones). Re-run the full
  # suite here so an untested build can NEVER reach GHCR or the release page.
  test:
    name: Test Release Candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
          cache-key: release-gate
      - name: Release metadata
        run: python3 scripts/release/release_tool.py check --tag "$GITHUB_REF_NAME"
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --workspace --locked

  # ── Build Binaries ───────────────────────────────────────────────────────
  build-binaries:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: parqtel-linux-amd64
          - target: aarch64-unknown-linux-gnu
            # Native arm64 runner. Cross-compiling from x86_64 is not enough:
            # rdkafka-sys compiles librdkafka with cmake and needs a matching
            # aarch64 C++ compiler, which the x86 runner does not carry.
            os: ubuntu-24.04-arm
            artifact: parqtel-linux-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: parqtel-darwin-amd64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: parqtel-darwin-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
          cache-key: release-dist-${{ matrix.target }}
      # release-dist = fat LTO + 1 codegen unit (Cargo.toml). Local/CI builds
      # use the faster thin-LTO `release` profile.
      - name: Build
        run: cargo build --profile release-dist --locked -p parqtel-server --target ${{ matrix.target }}
      - name: Package
        run: |
          cd target/${{ matrix.target }}/release-dist
          tar czf ${{ matrix.artifact }}.tar.gz parqtel
          sha256sum ${{ matrix.artifact }}.tar.gz > ${{ matrix.artifact }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/${{ matrix.target }}/release-dist/${{ matrix.artifact }}.tar.gz
            target/${{ matrix.target }}/release-dist/${{ matrix.artifact }}.tar.gz.sha256

  # ── Docker Image ─────────────────────────────────────────────────────────
  docker-image:
    name: Docker (${{ matrix.arch }})
    # One native runner per architecture, reusing the binary the build matrix
    # already produced. Building both platforms in a single buildx build put
    # linux/arm64 through QEMU: the whole workspace (ring, zstd-sys,
    # rdkafka-sys, jemalloc-sys) recompiled under emulation and the v0.4.0
    # docker-publish job ran 2.5 h without finishing, while the native arm64
    # binary job took 8 min. Nothing compiles here now.
    runs-on: ${{ matrix.os }}
    needs: [test, build-binaries]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-latest
            artifact: parqtel-linux-amd64
          - arch: arm64
            os: ubuntu-24.04-arm
            artifact: parqtel-linux-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the prebuilt binary
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifact

      - name: Stage the image context
        # The Dockerfile's `dist` build context is exactly one file: the
        # release-profile binary from build-binaries.
        run: |
          mkdir -p dist
          tar xzf artifact/${{ matrix.artifact }}.tar.gz -C dist
          test -x dist/parqtel

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push linux/${{ matrix.arch }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime-prebuilt
          build-contexts: |
            dist=./dist
          platforms: linux/${{ matrix.arch }}
          push: true
          # Per-architecture ref; docker-manifest merges these into the
          # version, major.minor, major and latest refs.
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/parqtel/parqtel-oss
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
          provenance: true
          sbom: true

  docker-manifest:
    name: Docker Manifest
    runs-on: ubuntu-latest
    needs: docker-image
    outputs:
      version: ${{ steps.ver.outputs.version }}
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tags
        # /tmp/tags is passed to `imagetools create` as a `-t` list; keeping it
        # in a file avoids GITHUB_OUTPUT heredoc parsing traps.
        id: ver
        run: |
          version="${GITHUB_REF_NAME#v}"
          image="${REGISTRY}/${IMAGE_NAME}"
          {
            echo "$image:$version"
            echo "$image:${version%.*}"
            echo "$image:${version%%.*}"
            # `latest` is a moving pointer, never a prerelease target.
            case "$version" in
              *-*) ;;
              *) echo "$image:latest" ;;
            esac
          } > /tmp/tags
          echo "version=$version" >> "$GITHUB_OUTPUT"
          cat /tmp/tags

      - name: Create the multi-arch manifest
        run: |
          image="${REGISTRY}/${IMAGE_NAME}"
          version="${{ steps.ver.outputs.version }}"
          args=()
          while IFS= read -r tag; do
            args+=(-t "$tag")
          done < /tmp/tags
          docker buildx imagetools create "${args[@]}" \
            "$image:$version-amd64" "$image:$version-arm64"

      - name: Read the manifest digest
        id: manifest
        run: |
          digest=$(docker buildx imagetools inspect \
            "${REGISTRY}/${IMAGE_NAME}:${{ steps.ver.outputs.version }}" \
            --format '{{.Manifest.Digest}}')
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

  # ── Image Security Scan ──────────────────────────────────────────────────
  trivy-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    needs: docker-image
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      # Scan a LOCALLY built image instead of pulling the published digest:
      # GHCR packages are private by default and trivy's registry auth has
      # proven unreliable in the release path (three failed runs). Same image
      # content — it is built from the very binary docker-image published.
      - name: Fetch the prebuilt binary
        uses: actions/download-artifact@v4
        with:
          name: parqtel-linux-amd64
          path: artifact
      - name: Stage the image context
        run: |
          mkdir -p dist
          tar xzf artifact/parqtel-linux-amd64.tar.gz -C dist
      - name: Build local scan target
        # Same target and binary the release image published, so the scan sees
        # exactly what users pull. Nothing is compiled here.
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime-prebuilt
          build-contexts: |
            dist=./dist
          platforms: linux/amd64
          load: true
          tags: parqtel:scan
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: parqtel:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 0
          # PINNED, and the reason this job was blocked three times.
          # Left unpinned, the action resolved trivy v0.65.0, whose install
          # step aborted with a bare "exit code 1" right after resolving the
          # version — before the scan ever ran. Because `release` needs this
          # job, every failure also skipped the GitHub Release and the
          # homebrew tap, so a scanner-installer failure presented as a
          # failed release.
          #
          # v0.58.1 is the version the CI filesystem scan already pins and
          # runs green on every push, so the release path now uses a version
          # known to install rather than whatever the action defaults to.
          trivy-version: v0.58.1
          cache-dir: /tmp/trivy-cache
        # REPORT-ONLY: findings surface in the Security tab for triage.
        # Image-scan findings (base OS CVEs awaiting upstream fixes) have no
        # source-level remediation, so they must not gate
        # releases — the CI filesystem scan (exit-code 1) stays the hard
        # gate for what WE can fix. Scanner ERRORS still fail the job.
      - name: Upload Trivy scan results
        # Guarded: upload-sarif hard-fails on a missing or empty SARIF file,
        # which would turn "no vulnerabilities found" into a failed release.
        # A scan error still fails the step above, so this cannot mask one.
        if: ${{ hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image-scan

  # ── Sign Image with Cosign ──────────────────────────────────────────────
  sign-image:
    name: Sign Image (cosign)
    runs-on: ubuntu-latest
    needs: docker-manifest
    steps:
      - uses: sigstore/cosign-installer@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign image
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.docker-manifest.outputs.digest }}

  # ── Helm Chart ───────────────────────────────────────────────────────────
  helm-publish:
    name: Helm Publish
    runs-on: ubuntu-latest
    needs: docker-manifest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.0
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
      - name: Package chart
        run: helm package deploy/helm/parqtel --version ${{ needs.docker-manifest.outputs.version }} --app-version ${{ needs.docker-manifest.outputs.version }}
      - name: Push chart
        run: helm push parqtel-*.tgz oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts

  # ── GitHub Release ───────────────────────────────────────────────────────
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build-binaries, docker-manifest, helm-publish, trivy-scan, sign-image]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        # Pattern-scoped, not "download everything". Docker Publish leaves
        # two build-cache artifacts behind (parqtel~parqtel-oss~*.dockerbuild,
        # from cache-to: type=gha). They are never consumed by this job --
        # files: artifacts/**/*.tar.gz* matches only the binary tarballs --
        # and on this run one of them failed to download after five retries
        # with a bare "Artifact download failed" and no HTTP code, which
        # killed the release. Filtering to the four platform artifacts
        # removes a dependency on something we do not ship and that can
        # flake out underneath us. The glob parqtel-* matches the four
        # parqtel-{linux,darwin}-{amd64,arm64} artifacts and excludes the
        # parqtel~...dockerbuild cache artifacts.
        with:
          path: artifacts
          pattern: parqtel-*

      - name: Generate release notes
        # One source of truth: the changelog section for this tag, plus the
        # fixed install/verify footer. No generate_release_notes, so the page
        # matches CHANGELOG.md instead of GitHub's commit-subject summary.
        run: python3 scripts/release/release_tool.py notes --tag "$GITHUB_REF_NAME" > release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: artifacts/**/*.tar.gz*

  # ── Homebrew Tap ─────────────────────────────────────────────────────────
  # Zero-touch coordination with parqtel/homebrew-tap (see that repo's
  # docs/RELEASE_COORDINATION.md): on every release we fire a
  # repository_dispatch that makes the tap build its four per-platform
  # tarballs from this exact tag, publish them as a tap release, and open
  # a formula-bump PR. The tap's own audit workflow then verifies a real
  # `brew install` before the maintainer merges.
  # Requires secrets.HOMEBREW_TAP_DISPATCH_TOKEN (PAT with repo scope).
  notify-homebrew-tap:
    name: Notify homebrew-tap
    runs-on: ubuntu-latest
    needs: [github-release, docker-manifest]
    steps:
      - name: Trigger homebrew-tap build
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.HOMEBREW_TAP_DISPATCH_TOKEN }}
          repository: parqtel/homebrew-tap
          event-type: parqtel-oss-release
          client-payload: |
            {
              "version": "${{ needs.docker-manifest.outputs.version }}",
              "ref":     "${{ github.ref_name }}"
            }
