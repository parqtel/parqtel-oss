name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Quality Gate ──────────────────────────────────────────────────────────
  # A tag can be pushed to any commit (including stale ones). Re-run the full
  # suite here so an untested build can NEVER reach GHCR or the release page.
  test:
    name: Test Release Candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
          cache-key: release-gate
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --workspace --locked

  # ── Build Binaries ───────────────────────────────────────────────────────
  build-binaries:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: parqtel-linux-amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: parqtel-linux-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: parqtel-darwin-amd64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: parqtel-darwin-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
          cache-key: release-${{ matrix.target }}
      - name: Install cross tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
      - name: Build
        run: cargo build --release --locked -p parqtel-server --target ${{ matrix.target }}
      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ${{ matrix.artifact }}.tar.gz parqtel
          sha256sum ${{ matrix.artifact }}.tar.gz > ${{ matrix.artifact }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/${{ matrix.target }}/release/${{ matrix.artifact }}.tar.gz
            target/${{ matrix.target }}/release/${{ matrix.artifact }}.tar.gz.sha256

  # ── Docker Image ─────────────────────────────────────────────────────────
  docker-publish:
    name: Docker Publish
    runs-on: ubuntu-latest
    needs: test
    outputs:
      version: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Attest image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # ── Image Security Scan ──────────────────────────────────────────────────
  trivy-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    needs: docker-publish
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      # Scan the LOCALLY built image instead of pulling the published
      # digest: GHCR packages are private by default and trivy's registry
      # auth has proven unreliable in the release path (three failed
      # runs). Same image content — the publish job used this exact ref.
      - name: Build local scan target
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: parqtel:scan
          cache-from: type=gha
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: parqtel:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 0
          # PINNED, and the reason this job was blocked three times.
          # Left unpinned, the action resolved trivy v0.65.0, whose install
          # step aborted with a bare "exit code 1" right after resolving the
          # version — before the scan ever ran. Because `release` needs this
          # job, every failure also skipped the GitHub Release and the
          # homebrew tap, so a scanner-installer failure presented as a
          # failed release.
          #
          # v0.58.1 is the version the CI filesystem scan already pins and
          # runs green on every push, so the release path now uses a version
          # known to install rather than whatever the action defaults to.
          trivy-version: v0.58.1
          cache-dir: /tmp/trivy-cache
        # REPORT-ONLY: findings surface in the Security tab for triage.
        # Image-scan findings (distroless base CVEs awaiting upstream
        # fixes) have no source-level remediation, so they must not gate
        # releases — the CI filesystem scan (exit-code 1) stays the hard
        # gate for what WE can fix. Scanner ERRORS still fail the job.
      - name: Upload Trivy scan results
        # Guarded: upload-sarif hard-fails on a missing or empty SARIF file,
        # which would turn "no vulnerabilities found" into a failed release.
        # A scan error still fails the step above, so this cannot mask one.
        if: ${{ hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image-scan

  # ── Sign Image with Cosign ──────────────────────────────────────────────
  sign-image:
    name: Sign Image (cosign)
    runs-on: ubuntu-latest
    needs: docker-publish
    steps:
      - uses: sigstore/cosign-installer@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign image
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.docker-publish.outputs.digest }}

  # ── Helm Chart ───────────────────────────────────────────────────────────
  helm-publish:
    name: Helm Publish
    runs-on: ubuntu-latest
    needs: docker-publish
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.0
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
      - name: Package chart
        run: helm package charts/parqtel --version ${{ needs.docker-publish.outputs.version }} --app-version ${{ needs.docker-publish.outputs.version }}
      - name: Push chart
        run: helm push parqtel-*.tgz oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts

  # ── GitHub Release ───────────────────────────────────────────────────────
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build-binaries, docker-publish, helm-publish, trivy-scan, sign-image]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        # Pattern-scoped, not "download everything". Docker Publish leaves
        # two build-cache artifacts behind (parqtel~parqtel-oss~*.dockerbuild,
        # from cache-to: type=gha). They are never consumed by this job --
        # files: artifacts/**/*.tar.gz* matches only the binary tarballs --
        # and on this run one of them failed to download after five retries
        # with a bare "Artifact download failed" and no HTTP code, which
        # killed the release. Filtering to the four platform artifacts
        # removes a dependency on something we do not ship and that can
        # flake out underneath us. The glob parqtel-* matches the four
        # parqtel-{linux,darwin}-{amd64,arm64} artifacts and excludes the
        # parqtel~...dockerbuild cache artifacts.
        with:
          path: artifacts
          pattern: parqtel-*

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*.tar.gz*
          body: |
            ## Install

            **Docker:**
            ```bash
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.docker-publish.outputs.version }}
            ```

            **Helm:**
            ```bash
            helm install parqtel oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/parqtel \
              --version ${{ needs.docker-publish.outputs.version }}
            ```

            **Binary:**
            Download from the assets below for your platform, or via Homebrew:
            ```bash
            brew tap parqtel/tap
            brew install parqtel
            ```

            ## Verify

            ```bash
            # Docker image attestation
            gh attestation verify oci://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.docker-publish.outputs.version }} --owner parqtel

            # Binary checksum
            sha256sum -c parqtel-linux-amd64.tar.gz.sha256
              ```
  
  # ── Homebrew Tap ─────────────────────────────────────────────────────────
  # Zero-touch coordination with parqtel/homebrew-tap (see that repo's
  # docs/RELEASE_COORDINATION.md): on every release we fire a
  # repository_dispatch that makes the tap build its four per-platform
  # tarballs from this exact tag, publish them as a tap release, and open
  # a formula-bump PR. The tap's own audit workflow then verifies a real
  # `brew install` before the maintainer merges.
  # Requires secrets.HOMEBREW_TAP_DISPATCH_TOKEN (PAT with repo scope).
  notify-homebrew-tap:
    name: Notify homebrew-tap
    runs-on: ubuntu-latest
    needs: [github-release, docker-publish]
    steps:
      - name: Trigger homebrew-tap build
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.HOMEBREW_TAP_DISPATCH_TOKEN }}
          repository: parqtel/homebrew-tap
          event-type: parqtel-oss-release
          client-payload: |
            {
              "version": "${{ needs.docker-publish.outputs.version }}",
              "ref":     "${{ github.ref_name }}"
            }
