name: 'Setup Parqtel Rust Build'
description: >
  Rust toolchain + protoc (required by parqtel-ingest build.rs / prost-build)
  + shared Swatinem cache. Use in every job that compiles the workspace.

inputs:
  toolchain:
    description: 'Rust toolchain to install (stable, 1.86, nightly…)'
    required: false
    default: stable
  components:
    description: 'Extra rustup components (e.g. "rustfmt, clippy")'
    required: false
    default: ''
  targets:
    description: 'Additional rustup targets (cross-compile, e.g. aarch64-unknown-linux-gnu)'
    required: false
    default: ''
  cache-key:
    description: 'Extra key suffix for Swatinem/rust-cache'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    # prost-build shells out to protoc when compiling the OTLP protobufs;
    # runner images no longer ship it preinstalled. OS-aware install:
    # apt on Linux runners, brew on macOS runners (the Release workflow
    # builds darwin binaries on macOS hosts where apt-get does not exist).
    - name: Install protoc
      shell: bash
      run: |
        if [[ "$RUNNER_OS" == "macOS" ]]; then
          brew install protobuf 2>/dev/null || true
        else
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler
        fi
        protoc --version

    - uses: Swatinem/rust-cache@v2
      with:
        # Save the full registry+incremental so the next job reuses the
        # compiled dependencies instead of redoing 8-10 min of cold work.
        # `sharedKey` is appended to the cache key so MSRV / release /
        # build-binary caches don't collide.
        sharedKey: ${{ inputs.cache-key }}
        cache-on-failure: true
        cache-all-crates: true
        # Cache CARGO_HOME_REGISTRY (= $CARGO_HOME/registry) by default;
        # workspace + target are already covered. `cache-dir` is left to
        # the action's default ($CARGO_HOME) to keep hits high.
        # Sharing across branches: rust-cache v2 already uses the GHA cache,
        # which is branch-shared by default for tags but ref-scoped for
        # PRs — that is exactly what we want.
        # Pruning disabled: reaping old artifacts on a busy repo makes
        # cold-cache hits worse, not better.