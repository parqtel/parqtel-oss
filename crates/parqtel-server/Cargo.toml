[package]
name = "parqtel-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "parqtel"
path = "src/main.rs"

[dependencies]
parqtel-core = { workspace = true }
parqtel-ingest = { workspace = true }
