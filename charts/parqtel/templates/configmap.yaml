apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "parqtel.fullname" . }}
  labels:
    {{- include "parqtel.labels" . | nindent 4 }}
data:
  parqtel.toml: |
    [server]
    bind_address = "0.0.0.0:{{ .Values.service.port }}"
    max_connections = {{ .Values.parqtel.server.maxConnections | int }}
    shutdown_timeout_secs = {{ .Values.parqtel.server.shutdownTimeoutSecs | int }}
    {{- if .Values.ingestion.grpc.enabled }}
    grpc_bind_address = "0.0.0.0:{{ .Values.ingestion.grpc.port }}"
    {{- else }}
    grpc_bind_address = ""
    {{- end }}

    [storage]
    data_dir = "/data"
    block_duration_secs = {{ .Values.parqtel.storage.blockDurationSecs | int }}
    max_rows_per_block = {{ .Values.parqtel.storage.maxRowsPerBlock | int }}
    compression = {{ .Values.parqtel.storage.compression | quote }}
    retention_days = {{ .Values.parqtel.storage.retentionDays | int }}
    compaction_interval_secs = {{ .Values.parqtel.storage.compactionIntervalSecs | int }}
    row_group_size = {{ .Values.parqtel.storage.rowGroupSize | int }}

    [logs]
    data_dir = {{ .Values.parqtel.logs.dataDir | quote }}
    block_duration_secs = {{ .Values.parqtel.logs.blockDurationSecs | int }}
    max_rows_per_block = {{ .Values.parqtel.logs.maxRowsPerBlock | int }}
    compression = {{ .Values.parqtel.logs.compression | quote }}
    retention_days = {{ .Values.parqtel.logs.retentionDays | int }}
    compaction_interval_secs = {{ .Values.parqtel.logs.compactionIntervalSecs | int }}
    row_group_size = {{ .Values.parqtel.logs.rowGroupSize | int }}

    [ingest]
    max_body_size = {{ .Values.parqtel.ingest.maxBodySize | int }}
    wal_enabled = {{ .Values.parqtel.ingest.walEnabled }}
    log_wal_enabled = {{ .Values.parqtel.ingest.logWalEnabled }}
    [ingest.tail_sampling]
    keep_errors = {{ .Values.ingestion.tailSampling.keepErrors }}
    {{- if .Values.ingestion.tailSampling.slowTraceMs }}
    slow_trace_ms = {{ .Values.ingestion.tailSampling.slowTraceMs | int }}
    {{- end }}
    sampling_ratio = {{ .Values.ingestion.tailSampling.samplingRatio }}
    {{- with .Values.ingestion.tailSampling.perService }}
    [ingest.tail_sampling.per_service]
    {{- range $svc, $policy := . }}
    [ingest.tail_sampling.per_service.{{ $svc }}]
    keep_errors = {{ $policy.keepErrors }}
    {{- if $policy.slowTraceMs }}
    slow_trace_ms = {{ $policy.slowTraceMs | int }}
    {{- end }}
    sampling_ratio = {{ $policy.samplingRatio }}
    {{- end }}
    {{- end }}

    [query]
    max_series = {{ .Values.parqtel.query.maxSeries | int }}
    max_samples_per_series = {{ .Values.parqtel.query.maxSamplesPerSeries | int }}
    timeout_secs = {{ .Values.parqtel.query.timeoutSecs | int }}
    lookback_delta_ns = {{ .Values.parqtel.query.lookbackDeltaNs | int }}

    [ui]
    enabled = {{ .Values.parqtel.ui.enabled }}

    [telemetry]
    log_level = {{ .Values.parqtel.telemetry.logLevel | quote }}
    log_format = {{ .Values.parqtel.telemetry.logFormat | quote }}
    otlp_enabled = {{ .Values.parqtel.telemetry.otlpEnabled }}
    otlp_endpoint = {{ .Values.parqtel.telemetry.otlpEndpoint | quote }}
    export_interval_secs = {{ .Values.parqtel.telemetry.exportIntervalSecs | int }}
    profiling_enabled = {{ .Values.parqtel.telemetry.profilingEnabled }}
    profiling_frequency = {{ .Values.parqtel.telemetry.profilingFrequency | int }}

    [alerts]
    rules_dir = {{ .Values.parqtel.alerts.rulesDir | quote }}
    noise_window_firings = {{ .Values.parqtel.alerts.noiseWindowFirings | int }}
    refinement_enabled = {{ .Values.parqtel.alerts.refinementEnabled }}
    noise_suppression_threshold = {{ .Values.parqtel.alerts.noiseSuppressionThreshold }}
    [alerts.postmortem]
    enabled = {{ .Values.parqtel.alerts.postmortem.enabled }}
    auto_draft = {{ .Values.parqtel.alerts.postmortem.autoDraft }}
    postmortem_delay_minutes = {{ .Values.parqtel.alerts.postmortem.postmortemDelayMinutes | int }}
    template_path = {{ .Values.parqtel.alerts.postmortem.templatePath | quote }}
    auto_publish_notion = {{ .Values.parqtel.alerts.postmortem.autoPublishNotion }}
    auto_publish_gdocs = {{ .Values.parqtel.alerts.postmortem.autoPublishGdocs }}
    auto_publish_slack = {{ .Values.parqtel.alerts.postmortem.autoPublishSlack }}
    auto_create_jira_actions = {{ .Values.parqtel.alerts.postmortem.autoCreateJiraActions }}
    min_duration_minutes = {{ .Values.parqtel.alerts.postmortem.minDurationMinutes | int }}
    min_severity = {{ .Values.parqtel.alerts.postmortem.minSeverity | quote }}
    max_knowledge_entries = {{ .Values.parqtel.alerts.postmortem.maxKnowledgeEntries | int }}

    [alerts.notifications]
    dedup_flush_interval_secs = {{ .Values.parqtel.alerts.notifications.dedupFlushIntervalSecs | int }}
    max_concurrent_sends = {{ .Values.parqtel.alerts.notifications.maxConcurrentSends | int }}
    send_timeout_secs = {{ .Values.parqtel.alerts.notifications.sendTimeoutSecs | int }}
    self_monitoring_failure_threshold = {{ .Values.parqtel.alerts.notifications.selfMonitoringFailureThreshold }}
    {{- with .Values.parqtel.alerts.notifications.routes }}
    [[alerts.notifications.routes]]
    {{- range $route := . }}
    name = {{ $route.name | quote }}
    match_severity = {{ $route.matchSeverity | default "info" | quote }}
    {{- if $route.matchLabels }}
    match_labels = {{ toJson $route.matchLabels }}
    {{- end }}
    webhook_url = {{ $route.webhookUrl | quote }}
    repeat_minutes = {{ $route.repeatMinutes | default 240 | int }}
    {{- end }}
    {{- end }}

    {{- if .Values.provider.enabled }}
    [k8s_provider]
    enabled = true
    bind_address = "0.0.0.0:{{ .Values.provider.port }}"
    cache_expiry_secs = {{ .Values.provider.cacheExpirySecs | int }}
    query_timeout_secs = {{ .Values.provider.queryTimeoutSecs | int }}
    max_concurrent = {{ .Values.provider.maxConcurrent | int }}
    tls_secret_name = {{ .Values.provider.tlsSecretName | quote }}
    {{- end }}