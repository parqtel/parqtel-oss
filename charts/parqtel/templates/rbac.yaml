# RBAC resources for parqtel.
# Currently parqtel does not require any specific RBAC permissions,
# but this file provides a template for future needs (e.g. discovery).
{{- if .Values.serviceAccount.create -}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "parqtel.fullname" . }}
  labels:
    {{- include "parqtel.labels" . | nindent 4 }}
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "parqtel.fullname" . }}
  labels:
    {{- include "parqtel.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "parqtel.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "parqtel.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
