{{- if .Values.mcp.parqtel.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "parqtel.mcp.fullname" . }}-parqtel
  labels:
    {{- include "parqtel.mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-parqtel
spec:
  replicas: {{ .Values.mcp.parqtel.replicaCount }}
  selector:
    matchLabels:
      {{- include "parqtel.mcp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mcp-parqtel
  template:
    metadata:
      labels:
        {{- include "parqtel.mcp.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mcp-parqtel
    spec:
      serviceAccountName: {{ .Values.mcp.parqtel.serviceAccountName }}
      containers:
        - name: parqtel
          image: "{{ .Values.mcp.parqtel.image.repository }}:{{ .Values.mcp.parqtel.image.tag }}"
          imagePullPolicy: {{ .Values.mcp.parqtel.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.mcp.parqtel.containerPort }}
              protocol: TCP
          env:
            - name: MCP_HOST
              value: "0.0.0.0"
            - name: MCP_PORT
              value: "{{ .Values.mcp.parqtel.containerPort }}"
            - name: MCP_RATE_LIMIT
              value: "{{ .Values.mcp.parqtel.rateLimit }}"
            - name: PARQTEL_API_URL
              value: {{ .Values.mcp.parqtel.env.PARQTEL_API_URL | quote }}
          {{- if .Values.mcp.parqtel.resources }}
          resources:
            {{- toYaml .Values.mcp.parqtel.resources | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "parqtel.mcp.fullname" . }}-parqtel
  labels:
    {{- include "parqtel.mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-parqtel
spec:
  type: {{ .Values.mcp.parqtel.service.type }}
  ports:
    - port: {{ .Values.mcp.parqtel.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "parqtel.mcp.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-parqtel
{{- end }}
