apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: parqtelproviderconfigs.parqtel.com
spec:
  group: parqtel.com
  names:
    kind: ParqtelProviderConfig
    listKind: ParqtelProviderConfigList
    plural: parqtelproviderconfigs
    singular: parqtelproviderconfig
  scope: Cluster
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          spec:
            type: object
            properties:
              queryTimeoutSeconds:
                type: integer
                minimum: 1
                maximum: 30
                default: 10
              cacheExpirySeconds:
                type: integer
                minimum: 5
                maximum: 300
                default: 30
              maxConcurrentQueries:
                type: integer
                minimum: 1
                maximum: 50
                default: 10
              allowedNamespaces:
                type: array
                items:
                  type: string
              tlsConfig:
                type: object
                properties:
                  certSecret:
                    type: string
                  keySecret:
                    type: string
    additionalPrinterColumns:
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
