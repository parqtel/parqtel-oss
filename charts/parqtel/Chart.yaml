apiVersion: v2
name: parqtel
description: Ultra-lightweight SRE observability engine — streaming OTel into compressed Parquet
type: application
version: 0.2.0
appVersion: "0.1.0"
kubeVersion: ">=1.25.0-0"

keywords:
  - observability
  - metrics
  - opentelemetry
  - parquet
  - timeseries
  - sre
  - monitoring

home: https://github.com/parqtel/parqtel-oss
sources:
  - https://github.com/parqtel/parqtel-oss

maintainers:
  - name: parqtel-team
    email: maintainers@parqtel.com

annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: monitoring-logging
  artifacthub.io/signKey: ""
  artifacthub.io/prerelease: "false"
  artifacthub.io/containsSecurityUpdates: "false"

dependencies:
  - name: kube-prometheus-stack
    version: ">=45.0.0"
    repository: https://prometheus-community.github.io/helm-charts
    condition: kube-prometheus-stack.enabled
  - name: cert-manager
    version: ">=1.0.0"
    repository: https://charts.jetstack.io
    condition: cert-manager.enabled
