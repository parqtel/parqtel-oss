# ─────────────────────────────────────────────────────────────────────────────
# Parqtel Helm Chart — Default Values
# ─────────────────────────────────────────────────────────────────────────────

# -- Number of replicas. >1 requires shared storage (NFS/EFS).
replicaCount: 1

image:
  # -- Container image repository.
  repository: ghcr.io/parqtel/parqtel
  # -- Image tag. Defaults to chart appVersion.
  tag: ""
  # -- Image pull policy.
  pullPolicy: IfNotPresent
  # -- Image pull secrets.
  pullSecrets: []

# -- Override chart name.
nameOverride: ""
# -- Override full release name.
fullnameOverride: ""

# ── Service Account ──────────────────────────────────────────────────────────
serviceAccount:
  # -- Create a dedicated ServiceAccount.
  create: true
  # -- Annotations for the ServiceAccount (e.g., IAM role).
  annotations: {}
  # -- Explicit name. Generated from fullname if empty.
  name: ""

# ── Pod Configuration ────────────────────────────────────────────────────────
podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 65534
  runAsGroup: 65534
  runAsUser: 65534
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65534

# ── Resources ────────────────────────────────────────────────────────────────
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: "1"
    memory: 256Mi

# ── Service ──────────────────────────────────────────────────────────────────
service:
  # -- Service type: ClusterIP, NodePort, or LoadBalancer.
  type: ClusterIP
  # -- Service port.
  port: 8080
  # -- Annotations for the Service.
  annotations: {}
  # -- NodePort number (only when type=NodePort).
  nodePort: null

# ── Ingestion ────────────────────────────────────────────────────────────────
ingestion:
  grpc:
    # -- Serve OTLP over gRPC (the default OTel SDK transport).
    enabled: true
    # -- Container/service port for OTLP gRPC (4317 is the OTel default).
    port: 4317
    # -- Set empty to read from config file / defaults (0.0.0.0:4317).
    # Set "" via --set to disable gRPC ingestion.
    bindAddress: ""

# ── Deployment Strategy ──────────────────────────────────────────────────────
# -- Recreate recommended for single-replica with RWO PVC.
strategy:
  type: Recreate

# ── Ingress ──────────────────────────────────────────────────────────────────
ingress:
  # -- Enable Ingress resource.
  enabled: false
  # -- Ingress class name.
  className: ""
  # -- Ingress annotations.
  annotations: {}
  # -- Ingress host rules.
  hosts:
    - host: parqtel.local
      paths:
        - path: /
          pathType: Prefix
  # -- TLS configuration.
  tls: []

# ── Persistent Storage ───────────────────────────────────────────────────────
storage:
  # -- Enable persistent volume.
  enabled: true
  # -- Volume size.
  size: 10Gi
  # -- Storage class (empty = cluster default).
  storageClassName: ""
  # -- Access mode.
  accessMode: ReadWriteOnce
  # -- Use existing PVC name instead of creating one.
  existingClaim: ""

# ── Parqtel Engine Configuration ─────────────────────────────────────────────
parqtel:
  server:
    # -- Maximum concurrent connections.
    maxConnections: 1024
    # -- Graceful shutdown timeout in seconds.
    shutdownTimeoutSecs: 30
  storage:
    # -- Block duration in seconds (default 2h).
    blockDurationSecs: 7200
    # -- Max rows per Parquet block.
    maxRowsPerBlock: 1000000
    # -- Compression codec: zstd, snappy, lz4, none.
    compression: "zstd"
    # -- Data retention in days.
    retentionDays: 7
    # -- Compaction interval in seconds.
    compactionIntervalSecs: 3600
    # -- Parquet row group size.
    rowGroupSize: 100000
  ingest:
    # -- Max request body size in bytes (10MB).
    maxBodySize: 10485760
    # -- Enable write-ahead log.
    walEnabled: false
  query:
    # -- Max series returned per query.
    maxSeries: 1000
    # -- Max samples per series.
    maxSamplesPerSeries: 10000
    # -- Query timeout in seconds.
    timeoutSecs: 30
  ui:
    # -- Enable built-in web UI.
    enabled: true
  telemetry:
    # -- Log level: trace, debug, info, warn, error.
    logLevel: "info"
    # -- Log format: text or json.
    logFormat: "json"

# ── Autoscaling ──────────────────────────────────────────────────────────────
autoscaling:
  # -- Enable HPA. Requires shared storage for >1 replica.
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: null

# ── Pod Disruption Budget ────────────────────────────────────────────────────
podDisruptionBudget:
  # -- Enable PDB.
  enabled: false
  minAvailable: 1
  maxUnavailable: null

# ── Network Policy ───────────────────────────────────────────────────────────
networkPolicy:
  # -- Enable NetworkPolicy.
  enabled: false
  # -- Namespace containing Prometheus for scraping.
  monitoringNamespace: "monitoring"
  # -- Additional ingress pod selector labels.
  ingressSelectorLabels: {}

# ── Metrics & Monitoring ─────────────────────────────────────────────────────
metrics:
  # -- Enable /metrics endpoint.
  enabled: true
  serviceMonitor:
    # -- Create Prometheus Operator ServiceMonitor.
    enabled: false
    # -- Scrape interval.
    interval: "30s"
    # -- Scrape timeout.
    scrapeTimeout: "10s"
    # -- Honor metric labels from target.
    honorLabels: true
    # -- Relabeling rules.
    relabelings: []
  prometheusRule:
    # -- Create Prometheus Operator PrometheusRule.
    enabled: false
    rules:
      highMemory: true
      ingestErrors: true
      queryErrors: true
      storageAnomaly: true
      instanceDown: true

# ── Scheduling ───────────────────────────────────────────────────────────────
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# ── Extensions ───────────────────────────────────────────────────────────────
extraEnv: []
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []

# ── Lifecycle ────────────────────────────────────────────────────────────────
lifecycle:
  preStop:
    exec:
      command: ["/bin/sleep", "5"]

# ── Kubernetes Custom Metrics Provider ───────────────────────────────────────
provider:
  # -- Enable the custom metrics API server.
  enabled: false
  # -- Enable external metrics API.
  externalMetrics: true
  # -- HTTPS listener port.
  port: 6443
  # -- Metric cache expiry in seconds.
  cacheExpirySecs: 30
  # -- Query timeout in seconds.
  queryTimeoutSecs: 10
  # -- Max concurrent queries.
  maxConcurrent: 10
  # -- TLS certificate secret name.
  tlsSecretName: "parqtel-provider-tls"
  # -- Provider resource limits.
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 500m
      memory: 128Mi

# ── Cloud Integrations ───────────────────────────────────────────────────────
integrations:
  aws:
    # -- Enable AWS CloudWatch Metric Streams ingestion.
    enabled: false
    # -- Existing secret with FIREHOSE_API_KEY.
    existingSecret: ""
    # -- CloudWatch namespaces to accept (empty = all).
    acceptedNamespaces: []
    # -- Enrich with EC2 metadata.
    enrichEc2Metadata: true
  gcp:
    # -- Enable GCP Cloud Monitoring polling.
    enabled: false
    # -- Existing secret with GOOGLE_APPLICATION_CREDENTIALS.
    existingSecret: ""
    # -- GCP project ID.
    projectId: ""
    # -- Polling interval in seconds.
    scrapeIntervalSecs: 60
  azure:
    # -- Enable Azure Monitor polling.
    enabled: false
    # -- Existing secret with Azure credentials.
    existingSecret: ""
    # -- Azure subscription IDs.
    subscriptions: []
    # -- Polling interval in seconds.
    scrapeIntervalSecs: 60

# ── MCP Servers ──────────────────────────────────────────────────────────────
mcp:
  nameOverride: ""
  fullnameOverride: ""
  slack:
    enabled: false
    replicaCount: 1
    image:
      repository: ghcr.io/parqtel/parqtel-mcp-slack
      tag: ""
      pullPolicy: IfNotPresent
    containerPort: 3000
    rateLimit: 60
    serviceAccountName: default
    secretName: ""
    env:
      SLACK_BOT_TOKEN: ""
    service:
      type: ClusterIP
      port: 3000
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
  pagerduty:
    enabled: false
    replicaCount: 1
    image:
      repository: ghcr.io/parqtel/parqtel-mcp-pagerduty
      tag: ""
      pullPolicy: IfNotPresent
    containerPort: 3000
    rateLimit: 60
    serviceAccountName: default
    secretName: ""
    env:
      PAGERDUTY_API_KEY: ""
    service:
      type: ClusterIP
      port: 3000
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
  jira:
    enabled: false
    replicaCount: 1
    image:
      repository: ghcr.io/parqtel/parqtel-mcp-jira
      tag: ""
      pullPolicy: IfNotPresent
    containerPort: 3000
    rateLimit: 60
    serviceAccountName: default
    secretName: ""
    env:
      JIRA_BASE_URL: ""
      JIRA_USER_EMAIL: ""
      JIRA_API_TOKEN: ""
    service:
      type: ClusterIP
      port: 3000
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
  notion:
    enabled: false
    replicaCount: 1
    image:
      repository: ghcr.io/parqtel/parqtel-mcp-notion
      tag: ""
      pullPolicy: IfNotPresent
    containerPort: 3000
    rateLimit: 60
    serviceAccountName: default
    secretName: ""
    env:
      NOTION_API_KEY: ""
    service:
      type: ClusterIP
      port: 3000
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
  discord:
    enabled: false
    replicaCount: 1
    image:
      repository: ghcr.io/parqtel/parqtel-mcp-discord
      tag: ""
      pullPolicy: IfNotPresent
    containerPort: 3000
    rateLimit: 60
    serviceAccountName: default
    secretName: ""
    env:
      DISCORD_BOT_TOKEN: ""
    service:
      type: ClusterIP
      port: 3000
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
  gdocs:
    enabled: false
    replicaCount: 1
    image:
      repository: ghcr.io/parqtel/parqtel-mcp-gdocs
      tag: ""
      pullPolicy: IfNotPresent
    containerPort: 3000
    rateLimit: 60
    serviceAccountName: default
    secretName: ""
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ""
    service:
      type: ClusterIP
      port: 3000
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
  parqtel:
    enabled: false
    replicaCount: 1
    image:
      repository: ghcr.io/parqtel/parqtel-mcp-parqtel
      tag: ""
      pullPolicy: IfNotPresent
    containerPort: 3000
    rateLimit: 60
    serviceAccountName: default
    secretName: ""
    env:
      PARQTEL_API_URL: "http://parqtel:8080"
    service:
      type: ClusterIP
      port: 3000
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

# ── Optional Sub-charts ──────────────────────────────────────────────────────
kube-prometheus-stack:
  enabled: false
cert-manager:
  enabled: false
