{{- if .Values.mcp.notion.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "parqtel.mcp.fullname" . }}-notion
  labels:
    {{- include "parqtel.mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-notion
spec:
  replicas: {{ .Values.mcp.notion.replicaCount }}
  selector:
    matchLabels:
      {{- include "parqtel.mcp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mcp-notion
  template:
    metadata:
      labels:
        {{- include "parqtel.mcp.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mcp-notion
    spec:
      serviceAccountName: {{ .Values.mcp.notion.serviceAccountName }}
      containers:
        - name: notion
          image: "{{ .Values.mcp.notion.image.repository }}:{{ .Values.mcp.notion.image.tag }}"
          imagePullPolicy: {{ .Values.mcp.notion.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.mcp.notion.containerPort }}
              protocol: TCP
          env:
            - name: MCP_HOST
              value: "0.0.0.0"
            - name: MCP_PORT
              value: "{{ .Values.mcp.notion.containerPort }}"
            - name: MCP_RATE_LIMIT
              value: "{{ .Values.mcp.notion.rateLimit }}"
            {{- if .Values.mcp.notion.secretName }}
            - name: NOTION_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mcp.notion.secretName }}
                  key: notion-api-key
            {{- else }}
            - name: NOTION_API_KEY
              value: {{ .Values.mcp.notion.env.NOTION_API_KEY | quote }}
            {{- end }}
          {{- if .Values.mcp.notion.resources }}
          resources:
            {{- toYaml .Values.mcp.notion.resources | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "parqtel.mcp.fullname" . }}-notion
  labels:
    {{- include "parqtel.mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-notion
spec:
  type: {{ .Values.mcp.notion.service.type }}
  ports:
    - port: {{ .Values.mcp.notion.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "parqtel.mcp.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-notion
{{- end }}
