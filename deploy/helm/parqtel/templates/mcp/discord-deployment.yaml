{{- if .Values.mcp.discord.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "parqtel.mcp.fullname" . }}-discord
  labels:
    {{- include "parqtel.mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-discord
spec:
  replicas: {{ .Values.mcp.discord.replicaCount }}
  selector:
    matchLabels:
      {{- include "parqtel.mcp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mcp-discord
  template:
    metadata:
      labels:
        {{- include "parqtel.mcp.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mcp-discord
    spec:
      serviceAccountName: {{ .Values.mcp.discord.serviceAccountName }}
      containers:
        - name: discord
          image: "{{ .Values.mcp.discord.image.repository }}:{{ .Values.mcp.discord.image.tag }}"
          imagePullPolicy: {{ .Values.mcp.discord.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.mcp.discord.containerPort }}
              protocol: TCP
          env:
            - name: MCP_HOST
              value: "0.0.0.0"
            - name: MCP_PORT
              value: "{{ .Values.mcp.discord.containerPort }}"
            - name: MCP_RATE_LIMIT
              value: "{{ .Values.mcp.discord.rateLimit }}"
            {{- if .Values.mcp.discord.secretName }}
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mcp.discord.secretName }}
                  key: discord-bot-token
            {{- else }}
            - name: DISCORD_BOT_TOKEN
              value: {{ .Values.mcp.discord.env.DISCORD_BOT_TOKEN | quote }}
            {{- end }}
          {{- if .Values.mcp.discord.resources }}
          resources:
            {{- toYaml .Values.mcp.discord.resources | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "parqtel.mcp.fullname" . }}-discord
  labels:
    {{- include "parqtel.mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-discord
spec:
  type: {{ .Values.mcp.discord.service.type }}
  ports:
    - port: {{ .Values.mcp.discord.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "parqtel.mcp.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-discord
{{- end }}
