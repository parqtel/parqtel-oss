{{- if .Values.ha.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-headless" (include "parqtel.fullname" . | trunc 54 | trimSuffix "-") }}
  labels:
    {{- include "parqtel.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if .Values.ingestion.grpc.enabled }}
    - port: {{ .Values.ingestion.grpc.port }}
      targetPort: grpc
      protocol: TCP
      name: grpc
    {{- end }}
  selector:
    {{- include "parqtel.selectorLabels" . | nindent 4 }}
{{- end }}
