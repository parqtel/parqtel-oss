apiVersion: v1
kind: Service
metadata:
  name: {{ include "parqtel.fullname" . }}
  labels:
    {{- include "parqtel.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
    {{- if and .Values.ingestion.grpc.enabled (ne .Values.mode "sharded") }}
    - port: {{ .Values.ingestion.grpc.port }}
      targetPort: grpc
      protocol: TCP
      name: grpc
    {{- end }}
  {{- if eq .Values.mode "sharded" }}
  # Query traffic goes to the readers: a writer answers only from its own
  # local directory and would return a partial answer to a client that landed
  # on it.
  selector:
    {{- include "parqtel.shardedSelector" (dict "root" . "role" "reader") | nindent 4 }}
  {{- else }}
  selector:
    {{- include "parqtel.selectorLabels" . | nindent 4 }}
  {{- end }}
