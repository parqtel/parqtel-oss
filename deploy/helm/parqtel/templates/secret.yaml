{{- if .Values.extraEnv }}
{{- $hasSecrets := false }}
{{- range .Values.extraEnv }}
  {{- if .valueFrom }}
    {{- if .valueFrom.secretKeyRef }}
      {{- $hasSecrets = true }}
    {{- end }}
  {{- end }}
{{- end }}
{{- if $hasSecrets }}
# This is a stub for future secrets.
# Currently parqtel has no required secrets, but advanced users can add them here.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "parqtel.fullname" . }}
  labels:
    {{- include "parqtel.labels" . | nindent 4 }}
type: Opaque
data: {}
{{- end }}
{{- end }}
