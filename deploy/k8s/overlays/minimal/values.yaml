# Minimal resource configuration for parqtel
image:
  repository: ghcr.io/parqtel/parqtel-oss
  tag: "0.2.0"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 10m
    memory: 48Mi
  limits:
    cpu: 100m
    memory: 80Mi

storage:
  size: 1Gi
  storageClassName: "local-path"

provider:
  enabled: true
  externalMetrics: false
  port: 6443

parqtel:
  telemetry:
    logLevel: "debug"

service:
  port: 8080
