image:
  repository: ghcr.io/parqtel/parqtel-oss
  tag: "0.2.0"
  pullPolicy: Always

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 100m
    memory: 64Mi

storage:
  enabled: false

parqtel:
  storage:
    retentionDays: 0 # Ephemeral
  ui:
    enabled: false

ingress:
  enabled: false

service:
  port: 8080
