{{- if .Values.mcp.slack.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "parqtel.mcp.fullname" . }}-slack
  labels:
    {{- include "parqtel.mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-slack
spec:
  replicas: {{ .Values.mcp.slack.replicaCount }}
  selector:
    matchLabels:
      {{- include "parqtel.mcp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mcp-slack
  template:
    metadata:
      labels:
        {{- include "parqtel.mcp.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mcp-slack
    spec:
      serviceAccountName: {{ .Values.mcp.slack.serviceAccountName }}
      containers:
        - name: slack
          image: "{{ .Values.mcp.slack.image.repository }}:{{ .Values.mcp.slack.image.tag }}"
          imagePullPolicy: {{ .Values.mcp.slack.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.mcp.slack.containerPort }}
              protocol: TCP
          env:
            - name: MCP_HOST
              value: "0.0.0.0"
            - name: MCP_PORT
              value: "{{ .Values.mcp.slack.containerPort }}"
            - name: MCP_RATE_LIMIT
              value: "{{ .Values.mcp.slack.rateLimit }}"
            {{- if .Values.mcp.slack.secretName }}
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mcp.slack.secretName }}
                  key: slack-bot-token
            {{- else }}
            - name: SLACK_BOT_TOKEN
              value: {{ .Values.mcp.slack.env.SLACK_BOT_TOKEN | quote }}
            {{- end }}
          {{- if .Values.mcp.slack.resources }}
          resources:
            {{- toYaml .Values.mcp.slack.resources | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "parqtel.mcp.fullname" . }}-slack
  labels:
    {{- include "parqtel.mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-slack
spec:
  type: {{ .Values.mcp.slack.service.type }}
  ports:
    - port: {{ .Values.mcp.slack.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "parqtel.mcp.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-slack
{{- end }}
