{{- if .Values.mcp.pagerduty.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "parqtel.mcp.fullname" . }}-pagerduty
  labels:
    {{- include "parqtel.mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-pagerduty
spec:
  replicas: {{ .Values.mcp.pagerduty.replicaCount }}
  selector:
    matchLabels:
      {{- include "parqtel.mcp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mcp-pagerduty
  template:
    metadata:
      labels:
        {{- include "parqtel.mcp.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mcp-pagerduty
    spec:
      serviceAccountName: {{ .Values.mcp.pagerduty.serviceAccountName }}
      containers:
        - name: pagerduty
          image: "{{ .Values.mcp.pagerduty.image.repository }}:{{ .Values.mcp.pagerduty.image.tag }}"
          imagePullPolicy: {{ .Values.mcp.pagerduty.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.mcp.pagerduty.containerPort }}
              protocol: TCP
          env:
            - name: MCP_HOST
              value: "0.0.0.0"
            - name: MCP_PORT
              value: "{{ .Values.mcp.pagerduty.containerPort }}"
            - name: MCP_RATE_LIMIT
              value: "{{ .Values.mcp.pagerduty.rateLimit }}"
            {{- if .Values.mcp.pagerduty.secretName }}
            - name: PAGERDUTY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mcp.pagerduty.secretName }}
                  key: pagerduty-api-key
            {{- else }}
            - name: PAGERDUTY_API_KEY
              value: {{ .Values.mcp.pagerduty.env.PAGERDUTY_API_KEY | quote }}
            {{- end }}
          {{- if .Values.mcp.pagerduty.resources }}
          resources:
            {{- toYaml .Values.mcp.pagerduty.resources | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "parqtel.mcp.fullname" . }}-pagerduty
  labels:
    {{- include "parqtel.mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-pagerduty
spec:
  type: {{ .Values.mcp.pagerduty.service.type }}
  ports:
    - port: {{ .Values.mcp.pagerduty.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "parqtel.mcp.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-pagerduty
{{- end }}
