{{- if .Values.mcp.jira.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "parqtel.mcp.fullname" . }}-jira
  labels:
    {{- include "parqtel.mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-jira
spec:
  replicas: {{ .Values.mcp.jira.replicaCount }}
  selector:
    matchLabels:
      {{- include "parqtel.mcp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mcp-jira
  template:
    metadata:
      labels:
        {{- include "parqtel.mcp.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mcp-jira
    spec:
      serviceAccountName: {{ .Values.mcp.jira.serviceAccountName }}
      containers:
        - name: jira
          image: "{{ .Values.mcp.jira.image.repository }}:{{ .Values.mcp.jira.image.tag }}"
          imagePullPolicy: {{ .Values.mcp.jira.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.mcp.jira.containerPort }}
              protocol: TCP
          env:
            - name: MCP_HOST
              value: "0.0.0.0"
            - name: MCP_PORT
              value: "{{ .Values.mcp.jira.containerPort }}"
            - name: MCP_RATE_LIMIT
              value: "{{ .Values.mcp.jira.rateLimit }}"
            {{- if .Values.mcp.jira.secretName }}
            - name: JIRA_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mcp.jira.secretName }}
                  key: jira-base-url
            - name: JIRA_USER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mcp.jira.secretName }}
                  key: jira-user-email
            - name: JIRA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mcp.jira.secretName }}
                  key: jira-api-token
            {{- else }}
            - name: JIRA_BASE_URL
              value: {{ .Values.mcp.jira.env.JIRA_BASE_URL | quote }}
            - name: JIRA_USER_EMAIL
              value: {{ .Values.mcp.jira.env.JIRA_USER_EMAIL | quote }}
            - name: JIRA_API_TOKEN
              value: {{ .Values.mcp.jira.env.JIRA_API_TOKEN | quote }}
            {{- end }}
          {{- if .Values.mcp.jira.resources }}
          resources:
            {{- toYaml .Values.mcp.jira.resources | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "parqtel.mcp.fullname" . }}-jira
  labels:
    {{- include "parqtel.mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-jira
spec:
  type: {{ .Values.mcp.jira.service.type }}
  ports:
    - port: {{ .Values.mcp.jira.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "parqtel.mcp.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-jira
{{- end }}
