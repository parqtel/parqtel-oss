{{- if .Values.mcp.gdocs.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "parqtel.mcp.fullname" . }}-gdocs
  labels:
    {{- include "parqtel.mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-gdocs
spec:
  replicas: {{ .Values.mcp.gdocs.replicaCount }}
  selector:
    matchLabels:
      {{- include "parqtel.mcp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mcp-gdocs
  template:
    metadata:
      labels:
        {{- include "parqtel.mcp.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mcp-gdocs
    spec:
      serviceAccountName: {{ .Values.mcp.gdocs.serviceAccountName }}
      containers:
        - name: gdocs
          image: "{{ .Values.mcp.gdocs.image.repository }}:{{ .Values.mcp.gdocs.image.tag }}"
          imagePullPolicy: {{ .Values.mcp.gdocs.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.mcp.gdocs.containerPort }}
              protocol: TCP
          env:
            - name: MCP_HOST
              value: "0.0.0.0"
            - name: MCP_PORT
              value: "{{ .Values.mcp.gdocs.containerPort }}"
            - name: MCP_RATE_LIMIT
              value: "{{ .Values.mcp.gdocs.rateLimit }}"
            {{- if .Values.mcp.gdocs.secretName }}
            - name: GOOGLE_SERVICE_ACCOUNT_JSON
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mcp.gdocs.secretName }}
                  key: google-service-account-json
            {{- else }}
            - name: GOOGLE_SERVICE_ACCOUNT_JSON
              value: {{ .Values.mcp.gdocs.env.GOOGLE_SERVICE_ACCOUNT_JSON | quote }}
            {{- end }}
          {{- if .Values.mcp.gdocs.resources }}
          resources:
            {{- toYaml .Values.mcp.gdocs.resources | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "parqtel.mcp.fullname" . }}-gdocs
  labels:
    {{- include "parqtel.mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-gdocs
spec:
  type: {{ .Values.mcp.gdocs.service.type }}
  ports:
    - port: {{ .Values.mcp.gdocs.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "parqtel.mcp.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-gdocs
{{- end }}
