{{- if .Values.provider.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "parqtel.fullname" . }}-provider
  labels:
    {{- include "parqtel.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics-provider
spec:
  type: ClusterIP
  ports:
    - port: 443
      targetPort: {{ .Values.provider.port }}
      protocol: TCP
      name: https
  selector:
    {{- include "parqtel.selectorLabels" . | nindent 4 }}
{{- end }}
