# Values file with all features enabled for CI rendering test

replicaCount: 2

image:
  repository: ghcr.io/parqtel/parqtel
  tag: "v0.1.0"
  pullPolicy: Always

serviceAccount:
  create: true
  annotations:
    iam.amazonaws.com/role: parqtel-role

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"

podLabels:
  env: production

resources:
  limits:
    cpu: "1"
    memory: 256Mi
  requests:
    cpu: 200m
    memory: 128Mi

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: parqtel.example.com
      paths:
        - path: /
          pathType: Prefix

storage:
  enabled: true
  size: 50Gi
  storageClassName: premium-rwo
  accessMode: ReadWriteOnce

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 50

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  monitoringNamespace: "monitoring-stack"
  ingressSelectorLabels:
    app: frontend

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
  prometheusRule:
    enabled: true

parqtel:
  server:
    maxConnections: 2048
  storage:
    compression: "zstd"
    retentionDays: 30
  telemetry:
    logLevel: "debug"
    logFormat: "json"

extraEnv:
  - name: DEBUG_MODE
    value: "true"

extraVolumes:
  - name: secret-config
    secret:
      secretName: parqtel-secrets

extraVolumeMounts:
  - name: secret-config
    mountPath: /etc/secrets
    readOnly: true

nodeSelector:
  kubernetes.io/os: linux

tolerations:
  - key: "dedicated"
    operator: "Equal"
    value: "observability"
    effect: "NoSchedule"

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
                - parqtel
        topologyKey: "kubernetes.io/hostname"
