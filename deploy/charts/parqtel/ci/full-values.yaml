# Full CI values — tests all features enabled
replicaCount: 2

image:
  repository: ghcr.io/parqtel/parqtel
  tag: "latest"
  pullPolicy: Always

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: parqtel.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: parqtel-tls
      hosts:
        - parqtel.example.com

storage:
  enabled: true
  size: 50Gi
  storageClassName: gp3

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  monitoringNamespace: monitoring

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: "15s"
    scrapeTimeout: "10s"
    honorLabels: true
    relabelings: []
  prometheusRule:
    enabled: true
    rules:
      highMemory: true
      ingestErrors: true
      queryErrors: true
      storageAnomaly: true
      instanceDown: true

provider:
  enabled: true
  port: 6443
  cacheExpirySecs: 30
  queryTimeoutSecs: 10
  maxConcurrent: 10
  tlsSecretName: parqtel-provider-tls

integrations:
  aws:
    enabled: true
    existingSecret: aws-firehose-secret
    acceptedNamespaces: ["AWS/EC2", "AWS/ELB"]
    enrichEc2Metadata: true

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi

parqtel:
  storage:
    compression: zstd
    retentionDays: 30
  telemetry:
    logLevel: debug
    logFormat: json
