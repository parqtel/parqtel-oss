apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: parqtelmetricmappings.parqtel.io
spec:
  group: parqtel.io
  names:
    kind: ParqtelMetricMapping
    listKind: ParqtelMetricMappingList
    plural: parqtelmetricmappings
    singular: parqtelmetricmapping
    shortNames:
    - pmm
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          spec:
            type: object
            required:
            - metricName
            - sourceQuery
            - objectType
            properties:
              metricName:
                type: string
                description: The name exposed to Kubernetes HPA.
              sourceQuery:
                type: string
                description: The parqtel/PromQL query to evaluate.
              objectType:
                type: string
                enum: [pods, deployments, statefulsets, daemonsets, namespaces]
                description: Kubernetes object type this metric attaches to.
              namespaces:
                type: array
                items:
                  type: string
                description: List of namespaces to expose this metric in (empty means all).
              aggregation:
                type: string
                enum: [avg, sum, min, max, last]
                default: avg
                description: How to aggregate when multiple pods match a selector.
              windowSeconds:
                type: integer
                minimum: 15
                maximum: 3600
                default: 120
                description: Lookback window for the query in seconds.
              externalMetric:
                type: boolean
                default: false
                description: If true register under external.metrics.k8s.io.
              scalingFactor:
                type: number
                default: 1.0
                description: Optional multiplier applied to the raw value.
    additionalPrinterColumns:
    - name: Metric
      type: string
      jsonPath: .spec.metricName
    - name: ObjectType
      type: string
      jsonPath: .spec.objectType
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
