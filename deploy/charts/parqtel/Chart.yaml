apiVersion: v2
name: parqtel
description: An ultra-lightweight SRE observability tool supporting streaming OTel metrics ingestion into compressed 100MB Parquet chunks.
type: application
version: 0.1.0
appVersion: "0.1.0"
keywords:
  - observability
  - metrics
  - opentelemetry
  - parquet
  - timeseries
home: https://github.com/parqtel/parqtel
sources:
  - https://github.com/parqtel/parqtel
maintainers:
  - name: parqtel-team
    email: maintainers@parqtel.io
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/parqtel/parqtel

dependencies:
  - name: kube-prometheus-stack
    version: ">= 45.0.0"
    repository: https://prometheus-community.github.io/helm-charts
    condition: kube-prometheus-stack.enabled
  - name: cert-manager
    version: ">= 1.0.0"
    repository: https://charts.jetstack.io
    condition: cert-manager.enabled
