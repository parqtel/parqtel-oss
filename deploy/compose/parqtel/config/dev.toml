# parqtel development configuration
# Overrides for local development and testing

[server]
bind_address = "0.0.0.0:9090"
max_connections = 128
shutdown_timeout_secs = 5

[storage]
data_dir = "/var/lib/parqtel"
# Short block duration for fast feedback in dev
block_duration_secs = 30
max_rows_per_block = 10000
compression = "zstd"
# Short retention for lean dev environment
retention_days = 1
compaction_interval_secs = 60
row_group_size = 1000

[ingest]
# 5MB max batch in dev
max_body_size = 5242880
wal_enabled = false

[query]
max_series = 500
max_samples_per_series = 5000
timeout_secs = 10

[ui]
enabled = true

[telemetry]
log_level = "debug"
log_format = "text"
