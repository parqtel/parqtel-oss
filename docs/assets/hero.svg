<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Parqtel — OpenTelemetry metrics, logs and traces in Parquet</title>
  <desc id="hero-desc">Animated hero showing OTLP metrics, logs and traces flowing into a single Rust binary, landing as compressed Parquet blocks and returning through the query, alert and console surfaces.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1b2e"/>
      <stop offset="1" stop-color="#061018"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity=".30"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#7dd3fc" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <style>
      .eyebrow{fill:#5eead4;font:600 13px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:2.4px}
      .title{fill:#f8fafc;font:800 92px/1 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-4px}
      .tag{fill:#cbd5e1;font:400 21px/1.35 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
      .chip{fill:#e2e8f0;font:600 13px/1 ui-sans-serif,system-ui,sans-serif}
      .label{fill:#a7f3d0;font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.4px}
      .small{fill:#94a3b8;font:500 11px/1 ui-sans-serif,system-ui,sans-serif}
      .node{fill:#0f2138;stroke:#2dd4bf;stroke-opacity:.5;stroke-width:1.2}
      .rail{stroke:#2dd4bf;stroke-opacity:.25;stroke-width:1.2;fill:none}
      .flow{stroke:url(#teal);stroke-width:2;fill:none;stroke-dasharray:5 9;animation:flow 1.1s linear infinite}
      .flow2{stroke:url(#warm);stroke-width:2;fill:none;stroke-dasharray:5 9;animation:flow 1.6s linear infinite}
      .pulse{animation:pulse 3.2s ease-in-out infinite}
      .pulse2{animation:pulse 3.2s ease-in-out .7s infinite}
      .pulse3{animation:pulse 3.2s ease-in-out 1.4s infinite}
      .drift{animation:drift 6s ease-in-out infinite}
      @keyframes flow{to{stroke-dashoffset:-28}}
      @keyframes pulse{0%,100%{stroke-opacity:.35}50%{stroke-opacity:1}}
      @keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
      @media (prefers-reduced-motion: reduce){*{animation:none!important}.flow,.flow2{stroke-dasharray:none}}
    </style>
  </defs>

  <rect width="1200" height="430" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="430" rx="26" fill="url(#grid)"/>
  <circle cx="990" cy="126" r="240" fill="url(#glow)"/>
  <circle cx="1160" cy="410" r="160" fill="url(#glow)" opacity=".45"/>

  <g transform="translate(58 58)">
    <path d="M0 9h18M0 18h11" stroke="#5eead4" stroke-width="3" stroke-linecap="round"/>
    <text x="30" y="15" class="eyebrow">SRE OBSERVABILITY ENGINE</text>
    <text x="-4" y="112" class="title">Parqtel</text>
    <text x="0" y="158" class="tag">OpenTelemetry metrics, logs and traces</text>
    <text x="0" y="188" class="tag">compressed into Apache Parquet.</text>
    <text x="0" y="218" class="tag" fill="#94a3b8">One Rust binary. No cluster. No schema.</text>

    <g transform="translate(0 252)">
      <rect width="136" height="34" rx="17" fill="#0f2a3d" stroke="#2dd4bf" stroke-opacity=".45"/>
      <text x="18" y="22" class="chip">OTLP + gRPC</text>
      <rect x="146" width="118" height="34" rx="17" fill="#0f2a3d" stroke="#38bdf8" stroke-opacity=".4"/>
      <text x="164" y="22" class="chip">Parquet</text>
      <rect x="274" width="132" height="34" rx="17" fill="#0f2a3d" stroke="#fbbf24" stroke-opacity=".4"/>
      <text x="292" y="22" class="chip">PromQL API</text>
      <rect x="416" width="128" height="34" rx="17" fill="#0f2a3d" stroke="#fb7185" stroke-opacity=".35"/>
      <text x="434" y="22" class="chip">Alerting</text>
      <rect x="554" width="116" height="34" rx="17" fill="#0f2a3d" stroke="#2dd4bf" stroke-opacity=".45"/>
      <text x="572" y="22" class="chip">MCP / AI</text>
    </g>

    <text x="0" y="332" class="small">github.com/parqtel/parqtel-oss · Apache-2.0</text>
  </g>

  <g transform="translate(716 54)">
    <rect x="0" y="0" width="430" height="326" rx="18" fill="#081726" stroke="#38bdf8" stroke-opacity=".18"/>
    <text x="22" y="30" class="label">TELEMETRY PATH</text>

    <g class="drift">
      <rect x="22" y="52" width="112" height="44" rx="10" class="node pulse"/>
      <text x="38" y="70" class="chip">OTel SDK</text>
      <text x="38" y="86" class="small">metrics · logs</text>

      <rect x="22" y="112" width="112" height="44" rx="10" class="node pulse2"/>
      <text x="38" y="130" class="chip">Collector</text>
      <text x="38" y="146" class="small">batching · retry</text>

      <rect x="22" y="172" width="112" height="44" rx="10" class="node pulse3"/>
      <text x="38" y="190" class="chip">Prometheus</text>
      <text x="38" y="206" class="small">remote_write</text>

      <rect x="22" y="232" width="112" height="44" rx="10" class="node pulse"/>
      <text x="38" y="250" class="chip">Kafka / JSON</text>
      <text x="38" y="266" class="small">logs · apps</text>
    </g>

    <rect x="170" y="86" width="104" height="158" rx="14" fill="#0b2234" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="190" y="116" class="chip" fill="#5eead4">PARQTEL</text>
    <text x="184" y="140" class="small">ingest</text>
    <text x="184" y="158" class="small">buffer + WAL</text>
    <text x="184" y="176" class="small">query engine</text>
    <text x="184" y="194" class="small">alerts · rules</text>
    <text x="184" y="212" class="small">console / MCP</text>

    <rect x="308" y="86" width="100" height="72" rx="12" fill="#0b2234" stroke="#fbbf24" stroke-opacity=".55"/>
    <text x="324" y="112" class="chip" fill="#fde68a">Parquet</text>
    <text x="322" y="132" class="small">zstd blocks</text>

    <rect x="308" y="172" width="100" height="72" rx="12" fill="#0b2234" stroke="#38bdf8" stroke-opacity=".5"/>
    <text x="324" y="198" class="chip" fill="#bae6fd">S3 / disk</text>
    <text x="318" y="218" class="small">shared catalog</text>

    <path class="rail" d="M134 74 H170"/>
    <path class="rail" d="M134 134 H170"/>
    <path class="rail" d="M134 194 H170"/>
    <path class="rail" d="M134 254 H170"/>
    <path class="rail" d="M274 120 H308"/>
    <path class="rail" d="M274 208 H308"/>
    <path class="flow" d="M134 74 H170"/>
    <path class="flow2" d="M134 134 H170"/>
    <path class="flow" d="M134 194 H170"/>
    <path class="flow2" d="M134 254 H170"/>
    <path class="flow" d="M274 120 H308"/>
    <path class="flow2" d="M274 208 H308"/>

    <circle cx="170" cy="74" r="3" fill="#5eead4"/>
    <circle cx="170" cy="134" r="3" fill="#fbbf24"/>
    <circle cx="170" cy="194" r="3" fill="#38bdf8"/>
    <circle cx="170" cy="254" r="3" fill="#fb7185"/>
    <circle cx="308" cy="120" r="3" fill="#fbbf24"/>
    <circle cx="308" cy="208" r="3" fill="#38bdf8"/>

    <text x="22" y="304" class="small">WAL before acknowledgement · zstd blocks · live tail</text>
  </g>
</svg>
