<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="ing-title ing-desc">
  <title id="ing-title">Parqtel ingestion on-ramps</title>
  <desc id="ing-desc">Animated diagram of OTLP gRPC and HTTP, generic JSON logs, Prometheus remote_write and the Kafka consumer entering decoding, live log pipelines, the RED bridge, tail sampling, the memory buffer and WAL, then Parquet blocks.</desc>
  <defs>
    <linearGradient id="i-teal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0d9488"/><stop offset="1" stop-color="#0284c7"/></linearGradient>
    <style>
      .bg{fill:#fff}.lane{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.2}
      .node{fill:#fff;stroke:#64748b;stroke-width:1.2}.hot{fill:#ecfeff;stroke:#0891b2;stroke-width:1.4}
      .sink{fill:#fffbeb;stroke:#d97706;stroke-width:1.3}
      .t{fill:#0f172a;font:600 13px/1.2 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
      .s{fill:#475569;font:11px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace}
      .h{fill:#0f766e;font:700 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.2px}
      .flow{stroke:url(#i-teal);stroke-width:2;fill:none;stroke-dasharray:5 9;animation:flow 1.1s linear infinite}
      .pulse{animation:pulse 3.2s ease-in-out infinite}.pulse2{animation:pulse 3.2s ease-in-out .6s infinite}
      .pulse3{animation:pulse 3.2s ease-in-out 1.2s infinite}.pulse4{animation:pulse 3.2s ease-in-out 1.8s infinite}
      @keyframes flow{to{stroke-dashoffset:-28}}@keyframes pulse{0%,100%{stroke-opacity:.45}50%{stroke-opacity:1}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}.flow{stroke-dasharray:none}}
    </style>
  </defs>
  <rect class="bg" width="1000" height="470" rx="18"/>
  <text x="28" y="34" class="h">INGESTION ON-RAMPS · ONE DURABLE PATH</text>

  <rect class="lane" x="24" y="58" width="264" height="352" rx="14"/>
  <text x="42" y="82" class="h">TRANSPORT</text>
  <g class="pulse"><rect class="node" x="42" y="96" width="228" height="58" rx="8"/><text x="56" y="118" class="t">OTLP gRPC · :4317</text><text x="56" y="136" class="s">metrics · logs · traces</text></g>
  <g class="pulse2"><rect class="node" x="42" y="166" width="228" height="58" rx="8"/><text x="56" y="188" class="t">OTLP HTTP · /v1/*</text><text x="56" y="206" class="s">protobuf or JSON · gzip</text></g>
  <g class="pulse3"><rect class="node" x="42" y="236" width="228" height="58" rx="8"/><text x="56" y="258" class="t">Generic JSON · /api/v1/ingest</text><text x="56" y="276" class="s">X-Parqtel-Service</text></g>
  <g class="pulse4"><rect class="node" x="42" y="306" width="228" height="58" rx="8"/><text x="56" y="328" class="t">remote_write / Kafka</text><text x="56" y="346" class="s">/api/v1/write · [ingest.kafka]</text></g>

  <rect class="lane" x="322" y="58" width="350" height="352" rx="14"/>
  <text x="340" y="82" class="h">DECODE + DERIVE</text>
  <g class="pulse2"><rect class="hot" x="340" y="96" width="314" height="58" rx="8"/><text x="354" y="118" class="t">Decode + limits</text><text x="354" y="136" class="s">max body · concurrency · 429 + Retry-After</text></g>
  <g class="pulse3"><rect class="node" x="340" y="166" width="314" height="58" rx="8"/><text x="354" y="188" class="t">Live log pipelines</text><text x="354" y="206" class="s">parse · mask · metric_extract · route</text></g>
  <g class="pulse4"><rect class="node" x="340" y="236" width="314" height="58" rx="8"/><text x="354" y="258" class="t">RED bridge</text><text x="354" y="276" class="s">traces_service_requests_total</text>
    <text x="354" y="290" class="s">traces_service_{errors,duration_ms}_total</text></g>
  <g class="pulse"><rect class="node" x="340" y="306" width="314" height="58" rx="8"/><text x="354" y="328" class="t">Tail sampling</text><text x="354" y="346" class="s">keep_errors · slow_trace_ms · sampling_ratio</text></g>

  <rect class="lane" x="706" y="58" width="270" height="352" rx="14"/>
  <text x="724" y="82" class="h">DURABLE + QUERYABLE</text>
  <g class="pulse"><rect class="hot" x="724" y="96" width="234" height="58" rx="8"/><text x="738" y="118" class="t">Memory buffer</text><text x="738" y="136" class="s">bounded rows/bytes · live tail</text></g>
  <g class="pulse2"><rect class="node" x="724" y="166" width="234" height="58" rx="8"/><text x="738" y="188" class="t">WAL</text><text x="738" y="206" class="s">sync mode · replay on start</text></g>
  <g class="pulse3"><rect class="node" x="724" y="236" width="234" height="58" rx="8"/><text x="738" y="258" class="t">Rotator</text><text x="738" y="276" class="s">sharded metrics</text>
    <text x="738" y="290" class="s">serial logs + traces</text></g>
  <g class="pulse4"><rect class="sink" x="724" y="306" width="234" height="58" rx="8"/><text x="738" y="328" class="t">Parquet blocks</text><text x="738" y="346" class="s">series/log index · S3 publish</text></g>

  <path class="flow" d="M270 125 H322"/>
  <path class="flow" d="M270 195 H322"/>
  <path class="flow" d="M270 265 H322"/>
  <path class="flow" d="M270 335 H322"/>
  <path class="flow" d="M654 125 H706"/>
  <path class="flow" d="M654 195 H706"/>
  <path class="flow" d="M654 335 H706"/>
  <path class="flow" d="M841 154 V166"/>
  <path class="flow" d="M841 224 V236"/>
  <path class="flow" d="M841 294 V306"/>
</svg>
