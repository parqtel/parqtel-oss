<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="alert-title alert-desc">
  <title id="alert-title">Parqtel alert evaluation and delivery</title>
  <desc id="alert-desc">Animated diagram: YAML and preset rules are evaluated on an interval with a dedicated scan slot, the state machine records transitions and a history-derived noise score, the route tree applies matchers, continue, grouping, silences and inhibition, then the dispatcher retries to Slack, PagerDuty, Teams or a generic webhook through the egress policy.</desc>
  <defs>
    <linearGradient id="al-teal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0d9488"/><stop offset="1" stop-color="#0284c7"/></linearGradient>
    <linearGradient id="al-warm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d97706"/><stop offset="1" stop-color="#e11d48"/></linearGradient>
    <style>
      .bg{fill:#fff}.lane{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.2}
      .node{fill:#fff;stroke:#64748b;stroke-width:1.2}.hot{fill:#ecfeff;stroke:#0891b2;stroke-width:1.4}
      .route{fill:#f0fdfa;stroke:#0d9488;stroke-width:1.3}.recv{fill:#fffbeb;stroke:#d97706;stroke-width:1.3}
      .t{fill:#0f172a;font:600 13px/1.2 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
      .s{fill:#475569;font:11px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace}
      .h{fill:#0f766e;font:700 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.2px}
      .flow{stroke:url(#al-teal);stroke-width:2;fill:none;stroke-dasharray:5 9;animation:flow 1.1s linear infinite}
      .floww{stroke:url(#al-warm);stroke-width:2;fill:none;stroke-dasharray:5 9;animation:flow 1.5s linear infinite}
      .pulse{animation:pulse 3.2s ease-in-out infinite}.pulse2{animation:pulse 3.2s ease-in-out .7s infinite}
      .pulse3{animation:pulse 3.2s ease-in-out 1.4s infinite}
      @keyframes flow{to{stroke-dashoffset:-28}}@keyframes pulse{0%,100%{stroke-opacity:.45}50%{stroke-opacity:1}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}.flow,.floww{stroke-dasharray:none}}
    </style>
  </defs>
  <rect class="bg" width="1000" height="560" rx="18"/>
  <text x="28" y="34" class="h">ALERT EVALUATION → GROUPING → DELIVERY</text>

  <rect class="lane" x="24" y="58" width="220" height="462" rx="14"/>
  <text x="42" y="82" class="h">EVALUATE</text>
  <g class="pulse"><rect class="node" x="42" y="96" width="184" height="58" rx="8"/><text x="56" y="118" class="t">YAML + presets</text><text x="56" y="136" class="s">rules_dir · canary packs</text></g>
  <g class="pulse2"><rect class="hot" x="42" y="174" width="184" height="72" rx="8"/><text x="56" y="196" class="t">Evaluation loop</text><text x="56" y="214" class="s">alert_interval_secs</text><text x="56" y="232" class="s">dedicated scan slot</text></g>
  <g class="pulse3"><rect class="node" x="42" y="266" width="184" height="72" rx="8"/><text x="56" y="288" class="t">Threshold / MAD</text><text x="56" y="306" class="s">last sample per series</text><text x="56" y="324" class="s">or median ± sensitivity</text></g>
  <g class="pulse"><rect class="node" x="42" y="358" width="184" height="86" rx="8"/><text x="56" y="380" class="t">State machine</text><text x="56" y="398" class="s">Inactive → Pending</text><text x="56" y="416" class="s">Firing → Resolved</text><text x="56" y="434" class="s">noise_score from history</text></g>
  <text x="42" y="486" class="s">firing + resolved → route</text>

  <rect class="lane" x="284" y="58" width="330" height="462" rx="14"/>
  <text x="302" y="82" class="h">ROUTE TREE</text>
  <g class="pulse2"><rect class="route" x="302" y="96" width="294" height="64" rx="8"/><text x="316" y="118" class="t">Root route</text><text x="316" y="136" class="s">matchers · continue · receiver</text></g>
  <g class="pulse3"><rect class="route" x="302" y="176" width="140" height="64" rx="8"/><text x="316" y="198" class="t">child · critical</text><text x="316" y="216" class="s">group_by service</text></g>
  <g class="pulse"><rect class="route" x="456" y="176" width="140" height="64" rx="8"/><text x="470" y="198" class="t">child · warning</text><text x="470" y="216" class="s">group_wait 30s</text></g>
  <g class="pulse2"><rect class="node" x="302" y="260" width="294" height="54" rx="8"/><text x="316" y="282" class="t">Silences + inhibition</text><text x="316" y="300" class="s">source/target matchers · equal labels</text></g>
  <g class="pulse3"><rect class="node" x="302" y="330" width="294" height="54" rx="8"/><text x="316" y="352" class="t">Grouping + retry queue</text><text x="316" y="370" class="s">group_interval · repeat · backoff</text></g>
  <g class="pulse"><rect class="node" x="302" y="400" width="294" height="72" rx="8"/><text x="316" y="422" class="t">Egress policy</text><text x="316" y="440" class="s">allow_private=false · redirects off</text><text x="316" y="458" class="s">allow_hosts for internal sinks</text></g>

  <rect class="lane" x="638" y="58" width="338" height="462" rx="14"/>
  <text x="656" y="82" class="h">RECEIVERS</text>
  <g class="pulse"><rect class="recv" x="656" y="96" width="302" height="62" rx="8"/><text x="670" y="118" class="t">Slack incoming webhook</text><text x="670" y="136" class="s">channel · username · send_resolved</text></g>
  <g class="pulse2"><rect class="recv" x="656" y="176" width="302" height="62" rx="8"/><text x="670" y="198" class="t">PagerDuty Events v2</text><text x="670" y="216" class="s">dedup_key per group · trigger/resolve</text></g>
  <g class="pulse3"><rect class="recv" x="656" y="256" width="302" height="62" rx="8"/><text x="670" y="278" class="t">Microsoft Teams</text><text x="670" y="296" class="s">Adaptive Card · send_resolved</text></g>
  <g class="pulse"><rect class="recv" x="656" y="336" width="302" height="62" rx="8"/><text x="670" y="358" class="t">Generic webhook</text><text x="670" y="376" class="s">headers · redacted in API</text></g>
  <text x="656" y="428" class="s">400/401/403/404 fail fast</text>
  <text x="656" y="446" class="s">429/5xx/timeout retry with jitter</text>
  <text x="656" y="464" class="s">legacy routes only when routing absent</text>
  <text x="656" y="482" class="s">test_route dry-runs evaluation</text>

  <path class="flow" d="M244 125 H284"/>
  <path class="flow" d="M244 210 H284"/>
  <path class="flow" d="M244 300 H284"/>
  <path class="flow" d="M244 400 H284"/>
  <path class="floww" d="M614 128 H656"/>
  <path class="floww" d="M614 207 H656"/>
  <path class="floww" d="M614 287 H656"/>
  <path class="floww" d="M614 367 H656"/>
</svg>
