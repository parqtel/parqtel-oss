<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 260" role="img" aria-labelledby="argo-title argo-desc">
  <title id="argo-title">Argo Rollouts analysis through Parqtel</title>
  <desc id="argo-desc">Animated flow: an Argo Rollout canary step starts an AnalysisRun, the stock Prometheus provider calls Parqtel's query API, and ParQL evaluates OTel metrics and derived RED span metrics to decide pass or fail.</desc>
  <defs>
    <style>
      .bg{fill:#fff}.node{fill:#fff;stroke:#64748b;stroke-width:1.2}.hot{fill:#ecfeff;stroke:#0891b2;stroke-width:1.5}
      .ok{fill:#f0fdf4;stroke:#16a34a;stroke-width:1.3}.bad{fill:#fff7ed;stroke:#ea580c;stroke-width:1.3}
      .t{fill:#0f172a;font:600 13px/1.2 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
      .s{fill:#475569;font:11px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace}
      .h{fill:#0f766e;font:700 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.2px}
      .flow{stroke:#0891b2;stroke-width:2;fill:none;stroke-dasharray:5 9;animation:flow 1.1s linear infinite}
      .pulse{animation:pulse 3.2s ease-in-out infinite}.pulse2{animation:pulse 3.2s ease-in-out .7s infinite}
      .pulse3{animation:pulse 3.2s ease-in-out 1.4s infinite}
      @keyframes flow{to{stroke-dashoffset:-28}}@keyframes pulse{0%,100%{stroke-opacity:.45}50%{stroke-opacity:1}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}.flow{stroke-dasharray:none}}
    </style>
  </defs>
  <rect class="bg" width="940" height="260" rx="18"/>
  <text x="28" y="34" class="h">ARGO ROLLOUTS · PROMETHEUS PROVIDER · PARQTEL</text>

  <g class="pulse"><rect class="node" x="30" y="92" width="176" height="80" rx="10"/><text x="46" y="118" class="t">Rollout</text><text x="46" y="138" class="s">canary / blue-green</text><text x="46" y="154" class="s">step</text></g>
  <g class="pulse2"><rect class="node" x="250" y="92" width="176" height="80" rx="10"/><text x="266" y="118" class="t">AnalysisRun</text><text x="266" y="138" class="s">successCondition</text><text x="266" y="154" class="s">failureCondition</text></g>
  <g class="pulse3"><rect class="node" x="470" y="92" width="190" height="80" rx="10"/><text x="486" y="118" class="t">Prometheus provider</text><text x="486" y="138" class="s">stock Argo integration</text><text x="486" y="154" class="s">address = Parqtel</text></g>
  <g class="pulse"><rect class="hot" x="704" y="92" width="206" height="80" rx="10"/><text x="720" y="118" class="t">Parqtel /api/v1/query</text><text x="720" y="138" class="s">ParQL / PromQL</text><text x="720" y="154" class="s">metrics + RED spans</text></g>

  <path class="flow" d="M206 132 H250"/>
  <path class="flow" d="M426 132 H470"/>
  <path class="flow" d="M660 132 H704"/>

  <g class="pulse2"><rect class="ok" x="704" y="200" width="96" height="34" rx="8"/><text x="722" y="222" class="t">pass</text></g>
  <g class="pulse3"><rect class="bad" x="814" y="200" width="96" height="34" rx="8"/><text x="832" y="222" class="t">fail</text></g>
  <path class="flow" d="M807 172 V200"/>
  <path class="flow" d="M807 172 H862 V200"/>
  <text x="30" y="206" class="s">No custom provider or plugin.</text>
  <text x="30" y="224" class="s">The stock Prometheus provider is the whole integration.</text>
</svg>
