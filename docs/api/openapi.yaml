openapi: "3.0.3"
info:
  title: Parqtel API
  description: |
    Ultra-lightweight SRE observability engine — streaming OpenTelemetry metrics, logs, and traces into compressed Parquet.
    Exposes Prometheus-compatible query API, Grafana SimpleJSON datasource, alerting engine, and pipeline management.
  version: "0.3.1"
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: Parqtel
    url: https://github.com/parqtel/parqtel-oss

servers:
  - url: http://localhost:9090
    description: Local development
  - url: http://localhost:8080
    description: Default production

tags:
  - name: Health
    description: Health and operational endpoints
  - name: Ingestion
    description: OTLP data ingestion (metrics, logs, traces)
  - name: Query
    description: Prometheus-compatible query API
  - name: Logs
    description: Log query and field exploration
  - name: Alerts
    description: Alert rules and instances
  - name: Pipelines
    description: Recording rules and stream pipelines
  - name: Grafana
    description: Grafana SimpleJSON datasource
  - name: Correlation
    description: Cross-signal correlation and trace search

components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok

    SignalStats:
      type: object
      description: Per-signal storage stats from block index metadata.
      properties:
        blocks:
          type: integer
          description: Number of stored Parquet blocks.
        rows:
          type: integer
          description: Total stored rows across blocks.
        bytes:
          type: integer
          format: int64
          description: On-disk bytes across blocks.

    SignalRates:
      type: object
      description: Live ingestion-rate stats for one signal.
      properties:
        current_per_sec:
          type: integer
          description: Items ingested in the last complete second.
        avg_60s:
          type: number
          description: Items/sec averaged over the last 60 complete seconds.
        avg_5m:
          type: number
          description: Items/sec averaged over the last 5 minutes.
        avg_15m:
          type: number
          description: Items/sec averaged over the last 15 minutes.
        bytes_per_sec:
          type: number
          description: Wire payload bytes/sec averaged over the last 60 seconds.
        gap_secs:
          type: integer
          description: Seconds since the last ingested item (capped at the 15m window).
        total:
          type: integer
          format: int64
          description: Items ingested since process start.


    ApiResponse:
      type: object
      properties:
        status:
          type: string
          enum: [success, error]
        data:
          type: object
        error:
          type: string

    IngestResponse:
      type: object
      properties:
        ingested:
          type: integer
          example: 5

    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        errorType:
          type: string
          description: Machine-readable error class.
          example: bad_data
        error:
          type: string
          example: "Validation error: Missing resource_metrics"

    OtlpMetricsPayload:
      type: object
      required: [resource_metrics]
      properties:
        resource_metrics:
          type: array
          items:
            type: object
            properties:
              resource:
                type: object
                properties:
                  attributes:
                    type: array
                    items:
                      $ref: "#/components/schemas/KeyValue"
              scope_metrics:
                type: array
                items:
                  type: object
                  properties:
                    scope:
                      type: object
                      properties:
                        name:
                          type: string
                    metrics:
                      type: array
                      items:
                        $ref: "#/components/schemas/Metric"

    OtlpLogsPayload:
      type: object
      required: [resource_logs]
      properties:
        resource_logs:
          type: array
          items:
            type: object
            properties:
              resource:
                type: object
                properties:
                  attributes:
                    type: array
                    items:
                      $ref: "#/components/schemas/KeyValue"
              scope_logs:
                type: array
                items:
                  type: object
                  properties:
                    log_records:
                      type: array
                      items:
                        $ref: "#/components/schemas/LogRecord"

    OtlpTracesPayload:
      type: object
      required: [resource_spans]
      properties:
        resource_spans:
          type: array
          items:
            type: object

    KeyValue:
      type: object
      properties:
        key:
          type: string
        value:
          type: object
          properties:
            string_value:
              type: string
            int_value:
              type: integer
            double_value:
              type: number

    Metric:
      type: object
      properties:
        name:
          type: string
        gauge:
          type: object
          properties:
            data_points:
              type: array
              items:
                $ref: "#/components/schemas/DataPoint"
        sum:
          type: object
          properties:
            data_points:
              type: array
              items:
                $ref: "#/components/schemas/DataPoint"
            aggregation_temporality:
              type: integer
            is_monotonic:
              type: boolean
        histogram:
          type: object
          properties:
            data_points:
              type: array
              items:
                type: object
            aggregation_temporality:
              type: integer

    DataPoint:
      type: object
      properties:
        time_unix_nano:
          type: integer
          format: int64
        value:
          type: object
          properties:
            as_double:
              type: number
            as_int:
              type: integer
        attributes:
          type: array
          items:
            $ref: "#/components/schemas/KeyValue"

    LogRecord:
      type: object
      properties:
        time_unix_nano:
          type: integer
          format: int64
        severity_number:
          type: integer
        severity_text:
          type: string
        body:
          type: object
          properties:
            string_value:
              type: string
        attributes:
          type: array
          items:
            $ref: "#/components/schemas/KeyValue"

    LogEntry:
      type: object
      description: A log record as returned by the log query endpoints.
      properties:
        timestamp_ns:
          type: integer
          format: int64
        observed_timestamp_ns:
          type: integer
          format: int64
        severity_number:
          type: integer
        severity_text:
          type: string
        body:
          type: string
        attributes:
          type: object
          additionalProperties:
            type: string
        resource_attributes:
          type: object
          additionalProperties:
            type: string
        trace_id:
          type: string
          description: Hex-encoded trace id (empty when the record has none).
        span_id:
          type: string
          description: Hex-encoded span id (empty when the record has none).
        flags:
          type: integer
          format: int64
        scope_name:
          type: string
        scope_version:
          type: string

    PrometheusQueryResult:
      type: object
      properties:
        status:
          type: string
          enum: [success, error]
        data:
          $ref: "#/components/schemas/PrometheusData"

    PrometheusData:
      type: object
      description: >
        Prometheus-style query payload. `resultType` and `result` follow the
        Prometheus HTTP API; `totalSeriesCount` and `volumeSummary` are
        Parqtel extensions.
      properties:
        resultType:
          type: string
          enum: [vector, matrix]
        result:
          type: array
          items:
            $ref: "#/components/schemas/TimeSeries"
        totalSeriesCount:
          type: integer
        volumeSummary:
          type: array
          description: Bucketed ingestion volume for the query range (60 buckets).
          items:
            type: integer

    TimeSeries:
      type: object
      properties:
        metric:
          type: object
          additionalProperties:
            type: string
        value:
          type: array
          description: >
            Single sample `[timestamp, "value"]`. Present for instant queries
            (resultType=vector); omitted for range queries.
          items:
            type: array
            items:
              oneOf:
                - type: number
                - type: string
        values:
          type: array
          items:
            type: array
            items:
              oneOf:
                - type: number
                - type: string

    AlertRule:
      type: object
      required: [id, name, query, condition, severity]
      properties:
        id:
          type: string
        name:
          type: string
        signal:
          type: string
          default: metrics
        query:
          type: string
        condition:
          $ref: "#/components/schemas/AlertCondition"
        severity:
          type: string
          enum: [info, warning, critical]
        labels:
          type: object
          additionalProperties:
            type: string
        annotations:
          type: object
          additionalProperties:
            type: string
        enabled:
          type: boolean
          default: true
        noise_suppression_threshold:
          type: number
          default: 0.7
          description: Unacknowledged firings that resolved, derived from the alert transition history (0..1).
        source:
          type: object
          description: >
            Where the rule came from. Serialised as a tagged object with a
            `type` discriminator: `static`, `ai_derived` or `learned_anomaly`.
            The tagged variants carry their own extra fields and are omitted
            entirely when the rule has no source.
          properties:
            type:
              type: string
              enum: [static, ai_derived, learned_anomaly]

    AlertCondition:
      type: object
      required: [type, operator, value]
      properties:
        type:
          type: string
          example: threshold
        operator:
          type: string
          enum: [">", ">=", "<", "<=", "==", "!="]
        value:
          type: number
        for_duration_secs:
          type: integer
          default: 0

    AlertInstance:
      type: object
      properties:
        id:
          type: string
        rule_id:
          type: string
        rule_name:
          type: string
        fingerprint:
          type: integer
          format: int64
          description: Stable fingerprint of rule_id + sorted labels.
        state:
          type: string
          enum: [pending, firing, acknowledged, resolved, suppressed, noise_flagged]
        severity:
          type: string
        value:
          type: number
          nullable: true
          description: Evaluated value that triggered the alert; null when not evaluable.
        labels:
          type: object
          additionalProperties:
            type: string
        annotations:
          type: object
          additionalProperties:
            type: string
        started_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          nullable: true
        acknowledged_by:
          type: string
          nullable: true
        noise_score:
          type: number
          format: float
          description: Noise score assigned by the noise-suppression scorer.
        transition_log:
          type: array
          items:
            $ref: "#/components/schemas/StateTransition"
        notification_sent:
          type: boolean
        source_rule_type:
          type: string
          enum: [static, ai_derived, learned_anomaly]

    StateTransition:
      type: object
      properties:
        from:
          type: string
        to:
          type: string
        at:
          type: string
          format: date-time
        reason:
          type: string

    RecordingRuleGroup:
      type: object
      required: [name, rules]
      properties:
        name:
          type: string
        interval:
          type: string
          default: "1m"
        rules:
          type: array
          items:
            type: object
            required: [record, expr]
            properties:
              record:
                type: string
              expr:
                type: string
              labels:
                type: object
                additionalProperties:
                  type: string
              description:
                type: string

    PipelineDefinition:
      type: object
      required: [name, stages]
      properties:
        name:
          type: string
        description:
          type: string
        match:
          type: object
          properties:
            signal:
              type: string
            conditions:
              type: array
              items:
                $ref: "#/components/schemas/StageCondition"
        stages:
          type: array
          items:
            type: object
            required: [type]
            properties:
              type:
                type: string
                enum: [preprocessor, processor, metric_extract, masker, router]
              name:
                type: string
              processor:
                type: string
              source_field:
                type: string
              pattern:
                type: string
              target_fields:
                type: object
                additionalProperties:
                  type: string
              on_parse_failure:
                type: string
              fields:
                type: object
                additionalProperties: true
              conditions:
                type: array
                items:
                  $ref: "#/components/schemas/StageCondition"
              metric_name:
                type: string
              metric_type:
                type: string
              value_field:
                type: string

    StageCondition:
      type: object
      required: [field, op]
      properties:
        field:
          type: string
        op:
          type: string
        value:
          nullable: true

    SavedSearch:
      type: object
      required: [name, signal, query]
      properties:
        id:
          type: string
          description: Server-assigned ULID.
        name:
          type: string
        signal:
          type: string
          enum: [metrics, logs, traces]
        query:
          type: string
        range_minutes:
          type: integer
          format: int64
          default: 0
        created_at:
          type: integer
          format: int64
          description: Unix seconds when the search was created.

    AlertRoute:
      type: object
      required: [name, webhook_url]
      properties:
        name:
          type: string
        match_severity:
          type: string
          default: info
        match_labels:
          type: object
          additionalProperties:
            type: string
        webhook_url:
          type: string
        repeat_minutes:
          type: integer
          format: int64
          default: 60

    AlertSilence:
      type: object
      required: [name, starts_at, ends_at]
      properties:
        name:
          type: string
        created_by:
          type: string
        match_labels:
          type: object
          additionalProperties:
            type: string
        starts_at:
          type: integer
          format: int64
          description: Unix seconds when the silence starts.
        ends_at:
          type: integer
          format: int64
          description: Unix seconds when the silence ends.

    PipelineSearchRequest:
      type: object
      required: [query, start, end]
      properties:
        query:
          type: string
          description: >
            ParqtelQL pipeline, e.g.
            `fetch logs | filter level:ERROR | stats count() by service`.
        start:
          type: number
          description: Start timestamp (Unix seconds).
        end:
          type: number
          description: End timestamp (Unix seconds).

    SavedSearch:
      type: object
      description: A stored search (ParQL for metrics, ParqtelQL for logs and traces).
      required: [id, name, signal, query]
      properties:
        id:
          type: string
          description: Unique id (ULID at creation).
        name:
          type: string
          description: Human name shown in lists.
        signal:
          type: string
          enum: [metrics, logs, traces]
        query:
          type: string
        range_minutes:
          type: integer
          format: int64
          description: Preferred time-range preset in minutes (0 keeps the current range).
        created_at:
          type: integer
          format: int64
          description: Creation time in Unix seconds.

    DashboardPanel:
      type: object
      required: [title, signal, query]
      properties:
        id: { type: string }
        title: { type: string }
        signal: { type: string, enum: [metrics, logs] }
        query: { type: string }
        step_secs:
          type: integer
          minimum: 1
          maximum: 86400
        limit:
          type: integer
          minimum: 1
          maximum: 10000

    DashboardInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 120 }
        panels:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/DashboardPanel" }

    Dashboard:
      allOf:
        - $ref: "#/components/schemas/DashboardInput"
        - type: object
          required: [id, created_at, updated_at]
          properties:
            id: { type: string }
            created_at: { type: integer, format: int64 }
            updated_at: { type: integer, format: int64 }

    AlertRoute:
      type: object
      description: A notification route. An alert matches when its severity is at or above `match_severity` and its labels contain every entry of `match_labels`.
      required: [name, webhook_url]
      properties:
        name:
          type: string
        match_severity:
          type: string
          enum: [critical, page, warning, info]
          default: info
        match_labels:
          type: object
          additionalProperties: { type: string }
        webhook_url:
          type: string
          format: uri
        repeat_minutes:
          type: integer
          format: int64
          default: 240
          description: Minutes before an unresolved alert is re-sent (0 = no repeat).

    AlertSilence:
      type: object
      description: A silence window that suppresses matching alerts.
      required: [name, match_labels, starts_at, ends_at]
      properties:
        name:
          type: string
        created_by:
          type: string
        match_labels:
          type: object
          additionalProperties: { type: string }
        starts_at:
          type: integer
          format: int64
          description: Unix seconds when the silence starts.
        ends_at:
          type: integer
          format: int64
          description: Unix seconds when the silence ends.

    PipelineRequest:
      type: object
      description: A PQL pipeline query.
      required: [query, start, end]
      properties:
        query:
          type: string
          description: >
            `fetch logs|metrics|traces | filter <pql> | parse "<re>" as f |
            stats count/avg/min/max/sum/p50/p95/p99 by … interval=… | limit |
            correlate traces|logs window=…`
        start:
          type: number
          format: double
          description: Start of the window, as Unix seconds.
        end:
          type: number
          format: double
          description: End of the window, as Unix seconds.

paths:
  /ui:
    get:
      tags: [Health]
      summary: Embedded web console
      description: >
        The single-file console (HTML, CSS and JavaScript in one document, no
        external requests). Served gzipped with a content-hash ETag and a
        304 on revalidation. Returns 404 when `ui.enabled` is false.
      operationId: getUi
      responses:
        "200":
          description: The console
          content:
            text/html:
              schema:
                type: string
        "404":
          description: The console is disabled

  /oas:
    get:
      tags: [Health]
      summary: This OpenAPI description
      operationId: getOpenApi
      responses:
        "200":
          description: The OpenAPI 3 description of this API
          content:
            text/yaml:
              schema:
                type: string

  /auth/login:
    get:
      tags: [Auth]
      summary: Start the OIDC authorization-code flow
      operationId: oidcLogin
      parameters:
        - name: redirect
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the IdP authorization endpoint
        "404":
          description: OIDC is not configured

  /auth/callback:
    get:
      tags: [Auth]
      summary: Complete the OIDC flow and set the session cookie
      operationId: oidcCallback
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Session established; redirect to the console
        "400":
          description: Invalid state
        "502":
          description: Discovery or token exchange failed

  /health:
    get:
      tags: [Health]
      summary: Liveness check
      description: >
        Static liveness probe. Returns 200 whenever the process can serve
        HTTP at all. It does not check storage or the ingest path, so a busy
        or degraded instance is not restarted. Use /ready to decide whether to
        send traffic.
      operationId: healthCheck
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /ready:
    get:
      tags: [Health]
      summary: Readiness check
      description: >
        Checks that the storage path is usable, by reading block-index
        metadata (no Parquet decode, no buffer mutation). Use this for the
        Kubernetes readiness probe and for load-balancer checks.
      operationId: readyCheck
      responses:
        "200":
          description: Ready to receive traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Storage unreachable or index unreadable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /metrics:
    get:
      tags: [Health]
      summary: Prometheus self-monitoring metrics
      operationId: getMetrics
      responses:
        "200":
          description: Prometheus exposition format
          content:
            text/plain:
              schema:
                type: string

  /:
    get:
      tags: [Health]
      summary: Redirect to the embedded console
      operationId: rootRedirect
      responses:
        "302":
          description: Redirect to /ui
          headers:
            Location:
              description: Target of the redirect.
              schema:
                type: string
                example: /ui

  /ui:
    get:
      tags: [Health]
      summary: Embedded web console
      description: >
        Serves the single-file embedded console (gzipped HTML) with ETag
        caching. Answers 304 when the client's If-None-Match matches.
      operationId: getUi
      responses:
        "200":
          description: The embedded console
          content:
            text/html:
              schema:
                type: string
        "304":
          description: Not modified (If-None-Match matched)

  /oas:
    get:
      tags: [Health]
      summary: OpenAPI document for this server
      operationId: getOpenApiSpec
      responses:
        "200":
          description: This OpenAPI document
          content:
            text/yaml:
              schema:
                type: string

  /debug/pprof/profile:
    get:
      tags: [Health]
      summary: CPU profile (pprof protobuf)
      description: >
        Captures a CPU profile over the requested window and returns it in the
        Google pprof protobuf format, consumable by `go tool pprof`. Returns
        404 when profiling is disabled, 429 when a capture is already
        running.
      operationId: pprofProfile
      parameters:
        - name: seconds
          in: query
          required: false
          schema:
            type: integer
            default: 30
            minimum: 1
            maximum: 120
          description: Capture window in seconds (clamped to 1..120).
      responses:
        "200":
          description: pprof protobuf profile
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Profiling is disabled (`telemetry.profiling_enabled = false`)
          content:
            text/plain:
              schema:
                type: string
        "429":
          description: A CPU capture is already running
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: Profiler failed to start or encode the report
          content:
            text/plain:
              schema:
                type: string

  /debug/pprof/summary:
    get:
      tags: [Health]
      summary: Top CPU consumers (JSON)
      description: >
        Captures a CPU profile over the requested window and returns the top
        CPU consumers as JSON. Returns 404 when profiling is disabled, 429
        when a capture is already running.
      operationId: pprofSummary
      parameters:
        - name: seconds
          in: query
          required: false
          schema:
            type: integer
            default: 30
            minimum: 1
            maximum: 120
          description: Capture window in seconds (clamped to 1..120).
        - name: top
          in: query
          required: false
          schema:
            type: integer
            default: 25
            minimum: 1
            maximum: 500
          description: Number of functions reported.
      responses:
        "200":
          description: CPU summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  window_secs:
                    type: integer
                  sampling_frequency_hz:
                    type: integer
                  threads_sampled:
                    type: integer
                  total_samples:
                    type: integer
                  sampled_cpu_seconds:
                    type: number
                  top_self_percent:
                    type: number
                  functions:
                    type: array
                    items:
                      type: object
                      properties:
                        function:
                          type: string
                        self_samples:
                          type: integer
                        cumulative_samples:
                          type: integer
                        self_cpu_seconds:
                          type: number
                        self_percent:
                          type: number
        "404":
          description: Profiling is disabled (`telemetry.profiling_enabled = false`)
          content:
            text/plain:
              schema:
                type: string
        "429":
          description: A CPU capture is already running
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: Profiler failed to start or build the report
          content:
            text/plain:
              schema:
                type: string

  /debug/pprof/memory:
    get:
      tags: [Health]
      summary: Memory-bottleneck snapshot (JSON)
      description: >
        Reports the process RSS high-water mark and the live in-memory buffer
        occupancy. Always available — unlike the CPU endpoints it does not
        consult `telemetry.profiling_enabled` and never takes a capture lock.
      operationId: pprofMemory
      responses:
        "200":
          description: Memory snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  rss_bytes:
                    type: integer
                    format: int64
                    nullable: true
                  rss_hwm_bytes:
                    type: integer
                    format: int64
                    nullable: true
                  buffer:
                    type: object
                    properties:
                      metrics_points:
                        type: integer
                      log_records:
                        type: integer
                      spans:
                        type: integer
                      total:
                        type: integer
                  note:
                    type: string
        "404":
          description: Profiling is disabled (`telemetry.profiling_enabled = false`)
          content:
            text/plain:
              schema:
                type: string
        "429":
          description: A CPU capture is already running
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: Memory snapshot could not be produced
          content:
            text/plain:
              schema:
                type: string

  /api/v1/stats:
    get:
      tags: [Health]
      summary: Storage, buffer, and configuration snapshot
      parameters:
        - name: dataset
          in: query
          required: false
          schema:
            type: string
          description: >
            `service.name` to summarize. Adds a `dataset` object with matching
            blocks, rows, bytes, metric count, global sidecar bytes, and
            compaction lag.
      description: >
        Per-signal storage stats (blocks, stored rows, on-disk bytes from
        block index metadata), live in-memory buffer counts, and the
        effective storage/ingest/query configuration. Powers the UI
        overview storage card and settings panel.
      operationId: getStats
      responses:
        "200":
          description: Stats snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: object
                    properties:
                      storage:
                        type: object
                        properties:
                          metrics: { $ref: "#/components/schemas/SignalStats" }
                          logs: { $ref: "#/components/schemas/SignalStats" }
                          traces: { $ref: "#/components/schemas/SignalStats" }
                      buffer:
                        type: object
                        properties:
                          metrics_points: { type: integer }
                          logs: { type: integer }
                          spans: { type: integer }
                      config:
                        type: object
                        description: Effective config (data dirs, retention, block duration, compression, limits).
                        properties:
                          storage:
                            type: object
                            properties:
                              data_dir:
                                type: string
                              block_duration_secs:
                                type: integer
                              max_rows_per_block:
                                type: integer
                              compression:
                                type: string
                              retention_days:
                                type: integer
                          logs:
                            type: object
                            properties:
                              data_dir:
                                type: string
                              block_duration_secs:
                                type: integer
                              max_rows_per_block:
                                type: integer
                              compression:
                                type: string
                              retention_days:
                                type: integer
                          ingest:
                            type: object
                            properties:
                              max_body_size:
                                type: integer
                                format: int64
                              tail_sampling:
                                type: object
                                additionalProperties: true
                          query:
                            type: object
                            properties:
                              max_series:
                                type: integer
                              max_samples_per_series:
                                type: integer
                              timeout_secs:
                                type: integer

  /api/v1/ingest_rates:
    get:
      tags: [Health]
      summary: Live per-signal ingestion rates
      description: >
        Current per-second rate, 60s/5m/15m averages, seconds since the
        last ingested item (gap), and lifetime totals for metrics, logs,
        and traces, plus per-second counts for a trailing window (default
        180s, up to the full 15-minute in-memory wheel via `history_secs`).
        Sourced from lock-free in-memory counters — no Parquet access.
        Powers the UI overview live-rate cards and spike/gap detection.
      operationId: getIngestRates
      parameters:
        - name: history_secs
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 900
            default: 180
          description: >
            Length of the per-second sparkline history arrays. Clamped to
            the 900-slot (15 min) in-memory rate wheel; older history is
            not retained in memory.
      responses:
        "200":
          description: Rate snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: object
                    properties:
                      now: { type: integer, description: Current epoch second }
                      history_secs: { type: integer, description: Length of the per-second history arrays (requested window, default 180, max 900) }
                      metrics: { $ref: "#/components/schemas/SignalRates" }
                      logs: { $ref: "#/components/schemas/SignalRates" }
                      traces: { $ref: "#/components/schemas/SignalRates" }
                      history:
                        type: object
                        description: Per-second counts, oldest first, keyed by signal (metrics/logs/traces).
                        properties:
                          metrics: { type: array, items: { type: integer } }
                          logs: { type: array, items: { type: integer } }
                          traces: { type: array, items: { type: integer } }

