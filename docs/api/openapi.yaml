          description: Per-panel results or errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  data:
                    type: object
                    properties:
                      dashboard_id: { type: string }
                      start: { type: integer, format: int64 }
                      end: { type: integer, format: int64 }
                      panels:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            title: { type: string }
                            result: {}
                            error: { type: string }
        "404":
