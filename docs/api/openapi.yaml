          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: alert not found }
        "409":
          description: Invalid state transition for the current alert state
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: invalid state transition }

  /api/v1/alerts/{id}/signal:
    post:
      tags: [Alerts]
      summary: Clear an alert's noise flag
      description: Restores the alert state and sets noise_score to 0.
      operationId: markAlertSignal
      parameters:
        - name: id
          in: path
