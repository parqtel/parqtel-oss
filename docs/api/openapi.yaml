          description: Alert marked as signal
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data: { $ref: "#/components/schemas/AlertInstance" }
        "400":
          description: Invalid alert id
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: invalid alert id }
        "404":
          description: Alert not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: alert not found }
        "409":
          description: Invalid state transition for the current alert state
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: invalid state transition }

  /api/v1/alerts/routes:
    get:
      tags: [Alerts]
      summary: List notification routes
      operationId: listAlertRoutes
      responses:
        "200":
          description: Routing table
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AlertRoute" }
    post:
      tags: [Alerts]
      summary: Replace the notification routes
      description: Replaces the whole routing table and applies it to the running router.
      operationId: setAlertRoutes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/AlertRoute" }
      responses:
        "200":
          description: Routes replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /api/v1/alerts/test_route:
    post:
      tags: [Alerts]
      summary: Dry-run the routing tree for a label set
      description: Returns matched routes, receivers, grouping keys, and silence/inhibition status. Never sends an external request.
      operationId: testAlertRoute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                labels:
                  type: object
                  additionalProperties: { type: string }
                  example: { severity: critical, "service.name": checkout }
      responses:
        "200":
          description: Route evaluation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  data:
                    type: object
                    properties:
                      silenced: { type: boolean }
                      inhibited: { type: boolean }
                      matched_routes:
                        type: array
                        items:
                          type: object
                          properties:
                            route_path_id: { type: string }
                            receiver: { type: string }
                            group_by: { type: array, items: { type: string } }
                            disable_grouping: { type: boolean }
                            group_key_hash: { type: integer, format: int64 }
                            group_labels:
                              type: object
                              additionalProperties: { type: string }
                            group_wait_secs: { type: integer, format: int64 }
                            group_interval_secs: { type: integer, format: int64 }
                            repeat_interval_secs: { type: integer, format: int64 }

  /api/v1/alerts/silences:
    get:
      tags: [Alerts]
      summary: List active silences
      operationId: listSilences
      responses:
        "200":
          description: Silences that have not expired
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AlertSilence" }
    post:
      tags: [Alerts]
      summary: Create or replace a silence
      operationId: createSilence
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertSilence" }
      responses:
        "200":
          description: Silence created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          description: Invalid silence (empty name, or ends_at before starts_at)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /api/v1/alerts/silences/{name}:
    delete:
      tags: [Alerts]
      summary: Delete a silence
      operationId: deleteSilence
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Silence deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "404":
          description: No such silence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /api/v1/saved_searches:
    get:
      tags: [Query]
      summary: List saved searches
      operationId: listSavedSearches
      responses:
        "200":
          description: Saved searches
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SavedSearch" }
    post:
      tags: [Query]
      summary: Create a saved search
      operationId: createSavedSearch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SavedSearch" }
      responses:
        "200":
          description: Saved search created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          description: Invalid saved search
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /api/v1/saved_searches/{id}:
    delete:
      tags: [Query]
      summary: Delete a saved search
      operationId: deleteSavedSearch
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Saved search deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "404":
          description: No such saved search
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /api/v1/dashboards:
    get:
      tags: [Query]
      summary: List persisted dashboards
      operationId: listDashboards
      responses:
        "200":
          description: Dashboards
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Dashboard" }
    post:
      tags: [Query]
      summary: Create a dashboard
      operationId: createDashboard
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DashboardInput" }
      responses:
        "201":
          description: Dashboard created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  data: { $ref: "#/components/schemas/Dashboard" }
        "400":
          description: Invalid dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /api/v1/dashboards/{id}:
    put:
      tags: [Query]
      summary: Replace a dashboard
      operationId: updateDashboard
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DashboardInput" }
      responses:
        "200":
          description: Dashboard updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  data: { $ref: "#/components/schemas/Dashboard" }
        "404":
          description: No such dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
    delete:
      tags: [Query]
      summary: Delete a dashboard
      operationId: deleteDashboard
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Dashboard deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "404":
          description: No such dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /api/v1/dashboards/{id}/render:
    get:
      tags: [Query]
      summary: Execute every panel of a dashboard
      operationId: renderDashboard
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: start
          in: query
          required: false
          schema:
            type: number
        - name: end
          in: query
          required: false
          schema:
            type: number
      responses:
        "200":
          description: Per-panel results or errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  data:
                    type: object
                    properties:
                      dashboard_id: { type: string }
                      start: { type: integer, format: int64 }
                      end: { type: integer, format: int64 }
                      panels:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            title: { type: string }
                            result: {}
                            error: { type: string }
        "404":
          description: No such dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /v1/search:
    post:
      tags: [Pipelines]
      summary: Run a PQL pipeline
      description: >
        Executes a cross-signal pipeline over the given window. The result is
        either a `rows` payload (unified field maps) or a `table` payload with
        columns, rows and an optional `timeseries`.
      operationId: runPipelineSearch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PipelineRequest" }
      responses:
        "200":
          description: Pipeline result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  data:
                    type: object
                    properties:
                      type:
                        type: string
                        enum: [rows, table]
                      columns:
                        type: array
                        items: { type: string }
                      rows:
                        type: array
                        items: { type: object }
                      timeseries:
                        type: object
                        properties:
                          timestamps:
                            type: array
                            items: { type: integer, format: int64 }
                          series:
                            type: array
                            items:
                              type: object
                              properties:
                                fields: { type: object }
                                values:
                                  type: array
                                  items: { type: number }
        "400":
          description: The pipeline could not be parsed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /api/v1/logs/stream:
    get:
      tags: [Logs]
      summary: Chunked NDJSON log results
      description: >
        Streams the same log search as /api/v1/logs as newline-delimited JSON.
        The range is split into 5-minute slices (each capped by `limit`), so
        the server's working set is bounded by a slice rather than the full
        result set.
      operationId: streamLogs
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
        - name: start
          in: query
          required: true
          schema:
            type: number
        - name: end
          in: query
          required: true
          schema:
            type: number
        - name: limit
          in: query
          schema:
            type: integer
            default: 1000
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
      responses:
        "200":
          description: NDJSON log records
          content:
            application/x-ndjson:
              schema:
                type: string

  /api/v1/logs/tail:
    get:
      tags: [Logs]
      summary: Live log tail (SSE)
      description: >
        Server-sent events over the in-memory log buffer. Emits `log` events
        containing a serialized LogRecord; polls every 250ms, so it is intended
        for live viewing rather than historical backfill.
      operationId: tailLogs
      parameters:
        - name: service_name
          in: query
          schema:
            type: string
        - name: body_contains
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: text/event-stream of log events
          content:
            text/event-stream:
              schema:
                type: string

  /api/v1/write:
    post:
      tags: [Ingestion]
      summary: Prometheus remote_write
      description: >
        Standard Prometheus remote_write body: snappy-compressed protobuf
        WriteRequest. Samples become gauge points; metadata is ignored.
        Content-Encoding must be `snappy`.
      operationId: remoteWrite
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Samples ingested
          content:
            application/json:
              schema:
                type: object
                properties:
                  ingested:
                    type: integer
        "400":
          description: Decode or validation failure
        "415":
          description: Unsupported Content-Encoding

  /api/v1/ingest:
    post:
      tags: [Ingestion]
      summary: Generic JSON log ingest
      description: >
        Accepts one JSON object or an array. `ingest.json_timestamp_field`,
        `json_body_field`, and `json_severity_field` select the mapped fields;
        every other key becomes a log attribute. `X-Parqtel-Service` sets
        `service.name` (default `default`).
      operationId: ingestGenericJson
      parameters:
        - name: X-Parqtel-Service
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Rows ingested
          content:
            application/json:
              schema:
                type: object
                properties:
                  ingested:
                    type: integer
        "400":
          description: Invalid JSON or mapping
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/rules:
    get:
      tags: [Alerts]
      summary: List alert rules
      operationId: listRules
      responses:
        "200":
          description: Alert rules
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AlertRule"
    post:
      tags: [Alerts]
      summary: Create alert rule
      operationId: createRule
      requestBody:
        required: true
        content:
          text/yaml:
            schema:
              type: string
              description: A single alert rule in YAML form.
              example: |
                id: http-error-rate-high
                name: HTTP Error Rate High
                signal: metrics
                query: 'http_requests_total{status=~"5.."}'
                condition:
                  type: threshold
                  operator: ">"
                  value: 0.05
                  for_duration_secs: 300
                severity: warning
      responses:
        "201":
          description: Rule created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    $ref: "#/components/schemas/AlertRule"
        "400":
          description: Invalid YAML or rule definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/rules/status:
    get:
      tags: [Alerts]
      summary: Recording-rule and pipeline registry status
      description: >
        Registry generation, recording-rule groups, pipeline definitions,
        parse/validation errors from the last load, whether the ruler loop is
        enabled, and the persisted per-group evaluation timestamps.
      operationId: getRulesStatus
      responses:
        "200":
          description: Registry status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: object
                    properties:
                      generation:
                        type: integer
                      recording_rules:
                        type: array
                        items:
                          type: object
                      pipelines:
                        type: array
                        items:
                          type: object
                      load_errors:
                        type: array
                        items:
                          type: string
                      ruler_enabled:
                        type: boolean
                      ruler_state:
                        type: object

  /api/v1/rules/{id}:
    put:
      tags: [Alerts]
      summary: Update alert rule
      operationId: updateRule
      description: >
        The path `id` is ignored by the handler — the effective rule id comes
        from the `id` field of the YAML request body.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Ignored; the rule id is taken from the request body.
      requestBody:
        required: true
        content:
          text/yaml:
            schema:
              type: string
              description: A single alert rule in YAML form.
      responses:
        "200":
          description: Rule updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    $ref: "#/components/schemas/AlertRule"
        "400":
          description: Invalid YAML or rule definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Rule not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Alerts]
      summary: Delete (disable) alert rule
      operationId: deleteRule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rule disabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: object
                    properties:
                      disabled:
                        type: boolean
                        example: true
        "404":
          description: Rule not found
          content:
            application/json:
              schema:
