    get:
      tags: [Logs]
      summary: Query logs
      operationId: queryLogs
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
          description: "Log filter expression (use * for all)"
        - name: start
          in: query
          required: true
          schema:
            type: number
          description: Start timestamp (Unix seconds)
        - name: end
          in: query
          required: true
          schema:
            type: number
          description: End timestamp (Unix seconds)
        - name: limit
          in: query
          schema:
            type: integer
            default: 1000
            maximum: 10000
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: severity_min
          in: query
          schema:
            type: integer
          description: "Minimum severity number (9=INFO, 13=WARN, 17=ERROR, 21=FATAL)"
        - name: search
          in: query
          schema:
