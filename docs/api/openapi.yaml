              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: object

  /v1/traces/search:
    get:
      tags: [Correlation]
      summary: Search traces
      operationId: searchTraces
      parameters:
        - name: service
          in: query
          schema:
            type: string
        - name: operation
          in: query
          schema:
            type: string
        - name: min_duration_ms
          in: query
          schema:
            type: integer
        - name: max_duration_ms
          in: query
          schema:
            type: integer
        - name: start
          in: query
          schema:
            type: number
        - name: end
          in: query
          schema:
            type: number
        - name: limit
          in: query
          description: Max spans returned (1-10000).
          schema:
            type: integer
            default: 200
            maximum: 10000
      responses:
        "200":
          description: Matching traces
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
