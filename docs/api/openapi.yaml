  /v1/correlate:
    get:
      tags: [Correlation]
      summary: Cross-signal correlation
      operationId: correlate
      parameters:
        - name: anchor_signal
          in: query
          required: true
          schema:
            type: string
            enum: [metrics, logs, traces]
        - name: anchor_timestamp_ns
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: anchor_labels
          in: query
          required: true
          schema:
            type: string
          description: JSON-encoded label set
        - name: target_signal
          in: query
          required: true
          schema:
            type: string
            enum: [metrics, logs, traces]
        - name: window_ns
          in: query
          schema:
            type: integer
            format: int64
            default: 5000000000
          description: Correlation window in nanoseconds (default 5s)
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
          description: Maximum number of correlated events returned.
      responses:
        "200":
          description: Correlated events
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: object
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Correlation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/traces/search:
    get:
      tags: [Correlation]
      summary: Search traces
      operationId: searchTraces
      parameters:
        - name: trace_id
          in: query
          schema:
            type: string
          description: Restrict the search to a single trace id.
        - name: q
          in: query
          schema:
            type: string
          description: ParqtelQL span predicate, pushed down into the scan.
        - name: start
          in: query
          schema:
            type: number
        - name: end
          in: query
          schema:
            type: number
        - name: limit
          in: query
          description: Max spans returned (1-10000).
          schema:
            type: integer
            default: 200
            maximum: 10000
      responses:
        "200":
          description: Matching traces
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: object
                    properties:
                      trace_id:
                        type: string
                      spans:
                        type: array
                        items:
                          type: object
                      total_spans_in_range:
                        type: integer
                        description: Exact span rows stored in the time range (from block metadata).
                      spans_matched:
                        type: integer
                        description: Matches found by the bounded scan pass.
                      truncated:
                        type: boolean
                      limit:
                        type: integer
                        description: Effective result cap applied to the scan.
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Trace search failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
