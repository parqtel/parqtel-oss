  /search:
    post:
      tags: [Grafana]
      summary: Grafana SimpleJSON - search metrics
      operationId: grafanaSearch
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                target:
                  type: string
      responses:
        "200":
          description: Available metrics
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /query:
    post:
      tags: [Grafana]
      summary: Grafana SimpleJSON - query time-series
      operationId: grafanaQuery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                targets:
                  type: array
                  items:
                    type: object
                    properties:
                      target:
                        type: string
                      type:
                        type: string
                        enum: [timeserie, table]
                range:
                  type: object
                  properties:
                    from:
                      type: string
                      format: date-time
                    to:
                      type: string
                      format: date-time
                interval_ms:
                  type: integer
                max_data_points:
                  type: integer
      responses:
        "200":
          description: Time-series data
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    target:
                      type: string
                    datapoints:
                      type: array
                      description: >
                        Samples as `[value, timestamp_ms]` pairs — the value
                        first, the timestamp in milliseconds.
                      items:
                        type: array
                        minItems: 2
                        maxItems: 2
                        items:
                          oneOf:
                            - type: number
                            - type: integer

  /annotations:
    post:
      tags: [Grafana]
      summary: Grafana SimpleJSON - query annotations
      operationId: grafanaAnnotations
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
