  /v1/correlate:
    get:
      tags: [Correlation]
      summary: Cross-signal correlation
      operationId: correlate
      parameters:
        - name: anchor_signal
          in: query
          required: true
          schema:
            type: string
            enum: [metrics, logs, traces]
        - name: anchor_timestamp_ns
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: anchor_labels
          in: query
          required: true
          schema:
            type: string
          description: JSON-encoded label set
        - name: target_signal
          in: query
          required: true
          schema:
            type: string
            enum: [metrics, logs, traces]
        - name: window_ns
          in: query
          schema:
            type: integer
            format: int64
            default: 300000000000
          description: Correlation window in nanoseconds (default 5min)
      responses:
        "200":
          description: Correlated events
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: object

