# Preset alert pack: External Secrets (external-secrets-operator)
#
# Source metrics: the external-secrets controller's prometheus exporter
# (:8080/metrics), scraped by the OpenTelemetry Collector's prometheus
# receiver and exported to Parqtel over OTLP. Required metric families:
#   externalsecret_sync_calls_total{status=Success|Error}  (counter)
#   externalsecret_stale                                 (gauge, 1 = stale)
#   kube_externalsecret_status_condition{condition=Available,status=...}
#       (kube-state-metrics with the externalsecrets resource enabled)
#
# "Stale" means the ExternalSecret's data is older than its
# refreshInterval + grace period — the value stayed put while the source
# changed. That is the single most reliable signal that secret rotation
# has silently stopped.

---
id: external-secret-stale
name: ExternalSecret data is stale
signal: metrics
query: 'externalsecret_stale'
condition:
  type: threshold
  operator: ">"
  value: 0
  for_duration_secs: 600
severity: warning
labels:
  component: external-secrets
  category: freshness
annotations:
  summary: "ExternalSecret has not synced for longer than its refresh interval"
  description: >-
    externalsecret_stale is 1: the secret's data is older than
    refreshInterval + grace. Rotation has silently stopped — usually a
    revoked or expired source credential, or the source being unreachable.
    The labels carry the ExternalSecret name and namespace.
  runbook: "https://external-secrets.io/latest/guides/troubleshooting/"
enabled: true

---
id: external-secret-sync-errors
name: ExternalSecret sync failures
signal: metrics
query: 'increase(externalsecret_sync_calls_total{status="Error"}[5m])'
condition:
  type: threshold
  operator: ">"
  value: 3
  for_duration_secs: 300
severity: warning
labels:
  component: external-secrets
  category: availability
annotations:
  summary: "ExternalSecret sync failed more than 3 times in 5 minutes"
  description: >-
    Repeated sync errors against the secret store (Vault, AWS Secrets
    Manager, etc.). Check the SecretStore/ClusterSecretStore status and the
    controller logs for the underlying provider error — the most common
    cause is an expired access credential.
  runbook: "https://external-secrets.io/latest/guides/troubleshooting/"
enabled: true

---
id: external-secret-unavailable
name: ExternalSecret not Available
signal: metrics
query: 'kube_externalsecret_status_condition{condition="Available",status=~"False|Unknown"}'
condition:
  type: threshold
  operator: ">"
  value: 0
  for_duration_secs: 300
severity: critical
labels:
  component: external-secrets
  category: availability
annotations:
  summary: "ExternalSecret Available condition is False or Unknown"
  description: >-
    The ExternalSecret reports Available=False (or Unknown, which usually
    means the controller has not reconciled it yet). Dependent workloads are
    reading stale or missing secret material. Requires kube-state-metrics
    with the externalsecrets resource enabled.
  runbook: "https://external-secrets.io/latest/api/externalsecrets/"
enabled: true

---
id: external-secret-never-synced
name: ExternalSecret never synced
signal: metrics
query: 'increase(externalsecret_sync_calls_total[30m])'
condition:
  type: threshold
  operator: "<"
  value: 1
  for_duration_secs: 0
severity: warning
labels:
  component: external-secrets
  category: freshness
annotations:
  summary: "ExternalSecret has zero sync calls in 30 minutes"
  description: >-
    No sync attempt in 30 minutes for at least one ExternalSecret. Combined
    with the stale rule, this catches newly created secrets that were never
    reconciled (typo'd store reference, missing RBAC) as well as rotation
    that stopped. Uses the &lt; operator deliberately: healthy secrets sync
    at least once per refresh interval.
  runbook: "https://external-secrets.io/latest/guides/troubleshooting/"
enabled: true
