[workspace]
members = [
    "crates/parqtel-core",
    "crates/parqtel-ingest",
    "crates/parqtel-query",
    "crates/parqtel-alert",
    "crates/parqtel-pipeline",
    "crates/parqtel-server",
    "crates/parqtel-mcp-core",
    "crates/parqtel-mcp-parqtel",
]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.88" # arrow 60.2.0 requires Rust 1.88
authors = ["parqtel team"]
license = "Apache-2.0"
description = "An ultra-lightweight SRE observability tool for streaming OTel metrics and logs into compressed Parquet chunks"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
arrow = { version = "60.2", features = ["ipc", "json", "csv", "prettyprint"] }
parquet = { version = "60.2", features = ["zstd", "async", "encryption"] }
arrow_array = { package = "arrow-array", version = "60.2" }
arrow_schema = { package = "arrow-schema", version = "60.2" }
zstd = "0.14"
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
prost = "0.13"
prost-types = "0.13"
tonic = { version = "0.13", features = ["gzip"] }
clap = { version = "4", features = ["derive", "env"] }
figment = { version = "0.10", features = ["toml", "env"] }
thiserror = "1"
anyhow = { version = "1.0.103", features = [] }
flate2 = "1"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "chrono"] }
tower = "0.4"
comfy-table = "7.1"
tower-http = { version = "0.5", features = ["cors", "trace", "limit", "timeout", "decompression-gzip"] }
ahash = "0.8"
tempfile = "3"
uuid = { version = "1.17", features = ["v4", "fast-rng"] }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
ulid = { version = "1", features = ["serde"] }
notify = { version = "6", features = ["macos_fsevent"] }
async-trait = "0.1"
object_store = { version = "0.14", features = ["aws"] }
jsonwebtoken = "9"
rdkafka = { version = "0.38", features = ["cmake-build"] }
# OpenTelemetry SDK for self-instrumentation (traces + SLI metrics over OTLP/gRPC).
# grpc-tonic keeps the exporter on the same stack as the ingest server.
opentelemetry = "0.30"
opentelemetry_sdk = { version = "0.30", features = ["rt-tokio"] }
# `default-features = false` drops the OTLP `trace`/`metrics` signals along with
# the default HTTP client — they must be re-enabled explicitly or the
# `SpanExporter`/`MetricExporter` types do not exist.
opentelemetry-otlp = { version = "0.30", default-features = false, features = [
    "grpc-tonic",
    "trace",
    "metrics",
] }
tracing-opentelemetry = "0.31"
# On-demand CPU profiling. `prost-codec` serves the Google pprof protobuf
# profile consumed by `go tool pprof` (which renders flamegraphs itself, e.g.
# `go tool pprof -http=:8081 .../debug/pprof/profile?seconds=30`). The shipped
# build.rs uses a pre-generated prost file, so no protoc is needed. Deliberately
# NOT using `protobuf-codec` (pulls vulnerable protobuf 2.x — RUSTSEC-2024-0437)
# or `flamegraph` (pulls inferno/quick-xml 0.26 — RUSTSEC-2026-0194/0195).
pprof = { version = "0.14", features = ["prost-codec"] }
futures = "0.3"
regex = "1"
reqwest = { version = "0.12.28", features = ["json", "rustls-tls"], default-features = false }
schemars = "0.8"
hyper = { version = "1.3", features = ["full"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "server-graceful", "service", "tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2"
snap = "1"
async-stream = "0.3"

# Internal crates
parqtel-core = { path = "crates/parqtel-core" }
parqtel-ingest = { path = "crates/parqtel-ingest" }
parqtel-query = { path = "crates/parqtel-query" }
parqtel-alert = { path = "crates/parqtel-alert" }
parqtel-pipeline = { path = "crates/parqtel-pipeline" }
parqtel-server = { path = "crates/parqtel-server" }
parqtel-mcp-core = { path = "crates/parqtel-mcp-core" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "warn"

# Local, CI and container builds use thin LTO: measured on 16 cores, cold build
# 5m34s → 2m30s and a one-file relink 3m48s → 1m01s, for a +24% binary.
# Shipped artifacts keep the fat-LTO profile below.
[profile.release]
lto = "thin"
codegen-units = 16
strip = "symbols"
panic = "unwind"
opt-level = 3

# Release binaries published by .github/workflows/release.yml.
# Fat LTO + one codegen unit: smallest binary, slowest build. Tag builds only.
[profile.release-dist]
inherits = "release"
lto = "fat"
codegen-units = 1

# `debug = 2` for every dependency costs ~11% of a cold build, 1.6 GB of target
# and a ~500 MB larger debug binary (i.e. slower links) for locals nobody
# inspects. Line tables still give file:line backtraces.
[profile.dev]
debug = "line-tables-only"