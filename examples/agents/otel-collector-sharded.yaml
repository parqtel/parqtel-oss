# OTel Collector -> Parqtel writer StatefulSet in a sharded install over OTLP/gRPC.
#
# Sharded mode shards each item to exactly ONE writer: the load_balancing
# exporter hashes the routing key with consistent hashing over the writer pods
# it discovers through DNS, so CPU, RAM, WAL and Parquet blocks are not
# duplicated and a row is never written twice. Sending every item to every
# writer (broadcast fan-out) is HA duplication and lives in
# otel-collector-ha.yaml instead.
#
# Routing keys must be per signal, and `routing_key` is set per exporter
# instance, hence one load_balancing exporter per pipeline:
#   - traces hash on `traceID`, so a whole trace lands on one writer and stays
#     trace-coherent (a writer owning spans from the same trace sees all of it).
#   - metrics and logs hash on `service`, so a service's stream is ordered on
#     one writer.
#
# The resolver needs a stable per-pod DNS name, which requires the writer
# Service to be headless: the chart renders `parqtel-writer` (release
# namespace; shown here as `parqtel`) as a headless Service driving the
# `parqtel-writer` StatefulSet, so each pod is `parqtel-writer-<i>.parqtel-writer`.
# Replace `parqtel` below with your release namespace.
extensions:
  file_storage:
    directory: /var/lib/otelcol/sharded-queue

receivers:
  otlp:
    protocols:
      grpc:
      http:

processors:
  batch:
    send_batch_size: 1000
    send_batch_max_size: 1000

exporters:
  load_balancing/traces:
    routing_key: traceID
    protocol:
      otlp:
        tls:
          insecure: true
    resolver:
      dns:
        hostname: parqtel-writer.parqtel.svc.cluster.local
        port: 4317
    sending_queue:
      enabled: true
      storage: file_storage
      # 6,000 batches x up to 1,000 points covers about 10 minutes per writer at ~9.5K points/s.
      queue_size: 6000
    retry_on_failure:
      enabled: true
      max_elapsed_time: 0s
  load_balancing/metrics:
    routing_key: service
    protocol:
      otlp:
        tls:
          insecure: true
    resolver:
      dns:
        hostname: parqtel-writer.parqtel.svc.cluster.local
        port: 4317
    sending_queue:
      enabled: true
      storage: file_storage
      queue_size: 6000
    retry_on_failure:
      enabled: true
      max_elapsed_time: 0s
  load_balancing/logs:
    routing_key: service
    protocol:
      otlp:
        tls:
          insecure: true
    resolver:
      dns:
        hostname: parqtel-writer.parqtel.svc.cluster.local
        port: 4317
    sending_queue:
      enabled: true
      storage: file_storage
      queue_size: 6000
    retry_on_failure:
      enabled: true
      max_elapsed_time: 0s

service:
  extensions: [file_storage]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [load_balancing/metrics]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [load_balancing/logs]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [load_balancing/traces]
