# Fluent Bit -> Parqtel generic JSON ingest.
[SERVICE]
    Flush        5
    Daemon       Off
    Log_Level    info

[INPUT]
    Name         tail
    Path         /var/log/**/*.log
    Tag          app.logs

[OUTPUT]
    Name         http
    Match        app.logs
    Host         parqtel
    Port         8080
    URI          /api/v1/ingest
    Format       json
    Json_date_key timestamp
    Json_date_format iso8601
    # HTTP_User / HTTP_Passwd are not bearer tokens; front with a proxy when auth is on.
    Header       X-Parqtel-Service fluent-bit
